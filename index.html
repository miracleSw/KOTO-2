ともだちが 結婚します。みんなで お祝いの パーティーを したいと 思います。プレゼントは、あたらしい 家で 料理の とき 使う ものが いいと 思います。ともだちは 「コーヒーが 好きだ」と 言っていましたから、すてきな コーヒーカップも あげたいです。", "kana": "らいげつ、クラスの ともだちが けっこんします。みんなで おいわいの パーティーを したいと おもいます。プレゼントは、あたらしい いえで りょうりの とき つかう ものが いいと おもいます。ともだちは 「コーヒーが すきだ」と いっていましたから、すてきな コーヒーカップも あげたいです。", "vietnamese": "Tháng sau một người bạn cùng lớp của tôi sẽ kết hôn. Chúng tôi nghĩ muốn cùng nhau tổ chức một bữa tiệc chúc mừng. Về món quà, tôi nghĩ món đồ dùng khi nấu ăn ở ngôi nhà mới là hợp lý. Vì người bạn đó từng nói rằng 'Mình thích cà phê' nên chúng tôi cũng muốn tặng một bộ tách cà phê thật đẹp.", "question_vi": "Tại sao nhóm bạn muốn tặng thêm bộ tách cà phê (コーヒーカップ)?", "options_vi": [{"id": "a", "text": "Vì người bạn sắp cưới từng nói rằng mình thích cà phê (コーヒーが好きだと言っていました)", "correct": true}, {"id": "b", "text": "Vì người bạn đó không thích nấu ăn ở nhà mới", "correct": false}, {"id": "c", "text": "Vì đó là quà mừng tốt nghiệp", "correct": false}]}], "my_japanese_templates": [{"id": "nb_L11", "lesson": 11, "prompt_vi": "Viết câu của riêng bạn về món ăn/đồ uống bạn sẽ chuẩn bị cho buổi dã ngoại (dùng V-ていきます hoặc ～にします):", "scaffold_jp": "ピクニックに [Món ăn/Đồ uống] を [作って／買って／持って] いきます。", "example_jp": "ピクニックに お茶と サンドイッチを 買っていきます。", "linked_grammar_id": "grammar_L11_1"}, {"id": "nb_L12", "lesson": 12, "prompt_vi": "Mô tả hương vị một món ăn bạn yêu thích bằng mẫu 〜くて／〜で、おいしいです:", "scaffold_jp": "[Món ăn] は [Tính từ くて/で]、おいしいです。", "example_jp": "この スープは あたたかくて、おいしいです。", "linked_grammar_id": "grammar_L12_2"}, {"id": "nb_L13", "lesson": 13, "prompt_vi": "Chia sẻ một nơi bạn đã từng đi hoặc một việc bạn đã từng trải nghiệm (V-たことがあります):", "scaffold_jp": "私は [Địa điểm / Hoạt động] たことが あります。", "example_jp": "私は 日本に 行ったことが あります。", "linked_grammar_id": "grammar_L13_1"}, {"id": "nb_L14", "lesson": 14, "prompt_vi": "Viết câu giới thiệu bạn đã học tiếng Nhật hoặc làm công việc hiện tại được bao lâu (V-て〜になります):", "scaffold_jp": "日本語の 勉強を はじめて [Số năm/tháng] に なります。", "example_jp": "日本語の 勉強を はじめて １年に なります。", "linked_grammar_id": "grammar_L14_1"}, {"id": "nb_L15", "lesson": 15, "prompt_vi": "Viết một lời khuyên sức khỏe cho bản thân hoặc bạn bè trước khi đi ngủ (ねる前に / V-るといいですよ):", "scaffold_jp": "ねる 前に、[Hành động V-る] と いいですよ。", "example_jp": "ねる 前に、おふろに 入ると いいですよ。", "linked_grammar_id": "grammar_L15_2"}, {"id": "nb_L16", "lesson": 16, "prompt_vi": "Kể hai hoạt động bạn thường làm vào cuối tuần hoặc vì sức khỏe (V1-たり、V2-たりしています):", "scaffold_jp": "けんこうの ために [V1-たり]、[V2-たり] しています。", "example_jp": "けんこうの ために 歩いたり、およいだり しています。", "linked_grammar_id": "grammar_L16_1"}, {"id": "nb_L17", "lesson": 17, "prompt_vi": "Kể về một món quà bạn đã tặng hoặc nhận được từ người thân (あげました / もらいました / 〜んです):", "scaffold_jp": "誕生日に [Người thân] に [Món quà] を [もらいました／あげました]。", "example_jp": "誕生日に あねに かばんを もらったんです。", "linked_grammar_id": "grammar_L17_1"}, {"id": "nb_L18", "lesson": 18, "prompt_vi": "Nêu ý kiến của bạn về một món quà mừng hoặc thuật lại lời một người bạn (〜と思います / 〜と言っていました):", "scaffold_jp": "お祝いは [Món quà/Hoạt động] が いいと 思います。", "example_jp": "お祝いは パーティーが いいと 思います。", "linked_grammar_id": "grammar_L18_1"}]}};

  <script>
/**
 * KOTO — Living Japanese Studio (ことばのアトリエ)
 * Multi-Skill SRS Engine, Confusion Weave Tracker & Japanese Linguistic Grader
 */

(function (global) {
  "use strict";

  const STORAGE_KEY = "koto_studio_state_v1";

  const SKILLS = [
    "recognition",
    "word_reading",
    "character_writing",
    "meaning_in_context",
    "production"
  ];

  function createDefaultState() {
    return {
      schemaVersion: "1.0.0",
      preferences: {
        theme: "light",
        furiganaMode: "on-touch",
        activeLesson: 11,
        sessionMinutes: 7,
        handPreference: "right",
        showGenkoGrid: true,
        retainHandwritingTraces: true,
        batterySaver: false
      },
      srsRecords: {}, // key: `${itemId}::${skill}`
      attempts: [],
      missedPrompts: [],
      confusionEdges: [
        {
          id: "conf_give_receive",
          sourceA: "grammar_L17_2 (あげます)",
          sourceB: "grammar_L17_3 (もらいます)",
          category: "Góc nhìn Trao / Nhận",
          count: 2,
          lastNote: "Cần chú ý ai là chủ ngữ (N1は) và hướng mũi tên món quà (→ hay ←)."
        },
        {
          id: "conf_da_na_clause",
          sourceA: "grammar_L17_1 (〜んです)",
          sourceB: "grammar_L18_1 (〜と思います)",
          category: "Hình thái Danh từ / Tính từ ナ",
          count: 1,
          lastNote: "Trước んです dùng な (プレゼントなんです); trước と思います dùng だ (好きだと思います)."
        },
        {
          id: "conf_kimasu_tsukimasu",
          sourceA: "kanji_row_L13_P3_16 (着ます = きます)",
          sourceB: "kanji_row_L13_P3_17 (着きます = つきます)",
          category: "Cùng Hán tự 着 khác cách đọc",
          count: 2,
          lastNote: "着ます (きます = mặc áo, lặp ở Bài 13 & 17) khác với 着きます (つきます = đến nơi)."
        }
      ],
      notebookEntries: [
        {
          id: "nb_seed_1",
          lesson: 11,
          japanese: "ピクニックに お茶と おにぎりを 持っていきます。",
          vietnamese: "Tôi sẽ mang trà và cơm nắm đi dã ngoại.",
          linkedIds: ["grammar_L11_1", "vocab_L11_04", "vocab_L11_05"],
          createdAt: "2026-10-14T09:00:00Z"
        }
      ],
      handwritingHistory: {} // key: kanjiChar -> { guideOpacity, unaidedPasses, tracePasses, lastEvaluation }
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      const parsed = JSON.parse(raw);
      return Object.assign(createDefaultState(), parsed);
    } catch (e) {
      return createDefaultState();
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Local storage quota or private mode warning:", e);
    }
  }

  /**
   * SM-2 / FSRS-inspired deterministic interval calculation.
   * grade: 1 = Quên (Again), 2 = Khó (Hard), 3 = Nhớ (Good), 4 = Dễ (Easy)
   * options.assisted: if true (e.g. guided trace), caps mastery so assisted trace NEVER marks unaided writing mastered.
   */
  function scheduleSRSReview(state, itemId, skill, grade, options = {}) {
    const key = `${itemId}::${skill}`;
    const now = Date.now();
    const DAY_MS = 86400 * 1000;
    const prev = state.srsRecords[key] || {
      itemId,
      skill,
      reps: 0,
      lapses: 0,
      intervalDays: 0,
      ease: 2.5,
      dueAt: now,
      lastGrade: null,
      assistedOnly: true,
      formatHistory: []
    };

    const assisted = Boolean(options.assisted);
    const format = options.format || "recognition";
    const formatHistory = prev.formatHistory.includes(format)
      ? prev.formatHistory
      : [...prev.formatHistory, format];

    let reps = prev.reps;
    let lapses = prev.lapses;
    let ease = prev.ease;
    let intervalDays = prev.intervalDays;

    if (assisted) {
      // Assisted trace / hint mode: does NOT advance unaided mastery interval beyond 0.5 day
      intervalDays = 0.5;
    } else if (grade <= 1) {
      reps = 0;
      lapses += 1;
      intervalDays = 0.04; // ~1 hour re-learning step
      ease = Math.max(1.3, ease - 0.2);
    } else if (grade === 2) {
      reps += 1;
      intervalDays = reps === 1 ? 1 : Math.max(1, Math.round(intervalDays * 1.2));
      ease = Math.max(1.3, ease - 0.15);
    } else if (grade === 3) {
      reps += 1;
      if (reps === 1) intervalDays = 1;
      else if (reps === 2) intervalDays = 3;
      else intervalDays = Math.round(intervalDays * ease);
    } else {
      reps += 1;
      if (reps === 1) intervalDays = 4;
      else intervalDays = Math.round(intervalDays * ease * 1.3);
      ease = Math.min(3.0, ease + 0.15);
    }

    const updated = {
      itemId,
      skill,
      reps,
      lapses,
      intervalDays,
      ease: Number(ease.toFixed(2)),
      dueAt: Math.round(now + intervalDays * DAY_MS),
      lastReviewedAt: now,
      lastGrade: grade,
      assistedOnly: assisted ? prev.assistedOnly : false,
      formatHistory
    };

    state.srsRecords[key] = updated;
    state.attempts.unshift({
      itemId,
      skill,
      grade,
      assisted,
      format,
      timestamp: now,
      prompt: options.prompt || "",
      userResponse: options.userResponse || ""
    });
    if (state.attempts.length > 250) state.attempts.length = 250;

    if (grade <= 2 && options.prompt) {
      const existingIdx = state.missedPrompts.findIndex(m => m.itemId === itemId && m.skill === skill);
      const record = {
        itemId,
        skill,
        prompt: options.prompt,
        expected: options.expected || "",
        userResponse: options.userResponse || "",
        diagnostic: options.diagnostic || "",
        timestamp: now
      };
      if (existingIdx >= 0) state.missedPrompts[existingIdx] = record;
      else state.missedPrompts.unshift(record);
    }

    saveState(state);
    return updated;
  }

  function recordConfusion(state, sourceA, sourceB, category, note) {
    const id = `conf_${sourceA}_${sourceB}`;
    const existing = state.confusionEdges.find(
      e => e.id === id || (e.sourceA.includes(sourceA) && e.sourceB.includes(sourceB))
    );
    if (existing) {
      existing.count += 1;
      if (note) existing.lastNote = note;
    } else {
      state.confusionEdges.unshift({
        id,
        sourceA,
        sourceB,
        category,
        count: 1,
        lastNote: note
      });
    }
    saveState(state);
  }

  /**
   * Careful Japanese normalization:

        status: "DA_NA_ERROR",
        confusionCategory: "Hình thái Danh từ / Tính từ ナ",

    let pts = points.map(p => [p[0], p[1]]);

      if (accum + d >= step) {
        const ratio = (step - accum) / (d || 1);
        const nx = pts[i - 1][0] + ratio * (pts[i][0] - pts[i - 1][0]);
        const ny = pts[i - 1][1] + ratio * (pts[i][1] - pts[i - 1][1]);
        resampled.push([nx, ny]);
        pts.splice(i, 0, [nx, ny]);
        accum = 0;
        i++;
      } else {
        accum += d;
        i++;
      }
    }
    while (resampled.length < n) {
      const last = points[points.length - 1];
      resampled.push([last[0], last[1]]);
    }

  /**
   * Discrete Fréchet distance between two resampled polylines P and Q in 109x109 space.
   */

    const m = Q.length;
    if (n === 0 || m === 0) return 999;
    const ca = Array.from({ length: n }, () => new Float64Array(m).fill(-1));

    function c(i, j) {
      if (ca[i][j] > -0.5) return ca[i][j];
      const d = euclideanDist(P[i], Q[j]);
      if (i === 0 && j === 0) {
        ca[i][j] = d;
      } else if (i > 0 && j === 0) {
        ca[i][j] = Math.max(c(i - 1, 0), d);
      } else if (i === 0 && j > 0) {
        ca[i][j] = Math.max(c(0, j - 1), d);

          Math.min(c(i - 1, j), c(i - 1, j - 1), c(i, j - 1)),

        expectedCount,

        strokeIndex: i + 1,
        angleDiffDeg: Math.round(degDiff),
        ok,
        issueVi: ok ? null : `Cần kiểm tra hướng nét ${i + 1}`

    messagesVi.push(
      `[Chế độ đối chiếu tự đánh giá] Chữ 「${kanjiRecord.character}」 kiểm tra số nét (${drawnCount}/${expectedCount}) và mã hướng JStroke; hãy bật lớp chữ mẫu Mincho để tự đánh giá hình dáng.`

      verificationMode: "JSTROKE_DIRECTIONAL_AND_FREEHAND_FALLBACK",

    startSessionTimer(mode) {
      this.sessionMode = mode;
      clearInterval(this.timerInterval);
      const mapSec = { "60s": 60, "3m": 180, "7m": 420, "15m": 900 };
      if (!mapSec[mode]) {
        this.timerRunning = false;
        this.timerSecondsLeft = 0;
        this.render();
        return;
      }
      this.timerSecondsLeft = mapSec[mode];
      this.timerRunning = true;
      if (mode === "60s") {
        this.inkStudyMode = "ONE_MIN_INK";
        this.inkLayerStep = 4; // Direct recall
        this.activeView = "ink";
      }
      this.timerInterval = setInterval(() => {
        if (this.timerSecondsLeft > 0) {
          this.timerSecondsLeft--;
          const badge = document.getElementById("koto-timer-display");
          if (badge) {
            const m = Math.floor(this.timerSecondsLeft / 60);
            const s = this.timerSecondsLeft % 60;
            badge.textContent = `${m}:${s < 10 ? "0" : ""}${s}`;
          }
        } else {
          clearInterval(this.timerInterval);
          this.timerRunning = false;
          this.showToast("Đã hoàn thành phiên học tập trung! Bạn có thể tiếp tục tự do hoặc nghỉ ngơi.");
          this.render();
        }

      this.render();

    escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    },

    renderRubyToken(surface, reading) {
      if (!reading || reading === surface) {
        return `<span class="token-surface">${this.escapeHtml(surface)}</span>`;
      }
      // Separate trailing hiragana okurigana so ruby sits strictly above Kanji!
      let sIdx = surface.length - 1;
      let rIdx = reading.length - 1;
      while (sIdx >= 0 && rIdx >= 0 && surface[sIdx] === reading[rIdx]) {
        const cp = surface.charCodeAt(sIdx);
        const isKana = cp >= 0x3040 && cp <= 0x30FF;
        if (!isKana) break;
        sIdx--;
        rIdx--;
      }
      const kanjiPart = surface.slice(0, sIdx + 1);
      const readingPart = reading.slice(0, rIdx + 1);
      const okuriganaPart = surface.slice(sIdx + 1);

      // Also check leading hiragana prefix like お in お茶 / お酒
      let pS = 0;
      let pR = 0;
      while (pS < kanjiPart.length && pR < readingPart.length && kanjiPart[pS] === readingPart[pR]) {
        const cp = kanjiPart.charCodeAt(pS);
        const isKana = cp >= 0x3040 && cp <= 0x30FF;
        if (!isKana) break;
        pS++;
        pR++;
      }
      const prefixKana = kanjiPart.slice(0, pS);
      const coreKanji = kanjiPart.slice(pS);
      const coreReading = readingPart.slice(pR);

      if (!coreKanji) {
        return `<span class="token-surface">${this.escapeHtml(surface)}</span>`;
      }

      return `<span class="token-surface">${this.escapeHtml(prefixKana)}<ruby>${this.escapeHtml(coreKanji)}<rt>${this.escapeHtml(coreReading)}</rt></ruby>${this.escapeHtml(okuriganaPart)}</span>`;
    },

              </button>
            </div>

            <div style="font-size:0.95rem;">
              <strong>Nghĩa tiếng Việt:</strong> ${this.escapeHtml(token.meaning_vi)}
              ${linkedVocab ? `<br/><span style="font-size:0.82rem; color:var(--ink-muted);">Nguồn từ vựng: <code>${linkedVocab.occurrence_id}</code> (Bài ${linkedVocab.lesson}, mục #${linkedVocab.position}) · Romaji hỗ trợ: <code>${this.escapeHtml(linkedVocab.romaji)}</code> · EN: ${this.escapeHtml(linkedVocab.english_gloss)}</span>` : ""}

            ${linkedKanjiChars.length > 0 ? `
              <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
                <div style="font-size:0.78rem; font-weight:700; color:var(--accent-aizome); margin-bottom:8px;">
                  漢字のレンズ · HÁN TỰ TRONG TỪ NÀY (Chạm để mở Phòng Mực Tàu / Kanji Ink Studio):

                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:8px;">
                  ${linkedKanjiChars.map(kc => `
                    <div style="padding:10px; background:var(--bg-paper-elevated); border:1px solid var(--border-hairline); border-radius:4px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
                      <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-family:var(--font-mincho); font-size:2.1rem; line-height:1; color:var(--ink-sumi);">${kc.character}</span>
                        <div>
                          <div style="font-weight:700; font-size:0.84rem;">Hán Việt: ${this.escapeHtml(kc.han_viet_candidates.join(", ") || "—")}</div>
                          <div style="font-size:0.75rem; color:var(--ink-muted);">${kc.stroke_count} nét · ${kc.verified_stroke_reference_available ? "Có mẫu nét chuẩn" : "Đối chiếu tự do"}</div>
                        </div>
                      </div>
                      <button class="btn-pill btn-primary" onclick="KotoApp.openKanjiInInkStudio('${kc.character}', '${token.kanji_row_ref || ""}', 1)">

                      </button>
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ""}

            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn-pill" onclick="KotoApp.openKaiwaForLesson(${ls.lesson})">

              </button>
              <button class="btn-pill" onclick="KotoApp.openShardForLesson(${ls.lesson})">
                Tình huống ngắn Bài ${ls.lesson}
              </button>
            </div>
          </div>
        `;
      }

      if (this.activeDimension === "UNDERSTAND") {
        const u = ls.understand;
        const cl = ls.contrast_lens;
        return `
          <div style="display:grid; gap:14px;">
            <div>
              <div style="font-size:0.78rem; font-weight:700; color:var(--accent-aizome);">CẤU TRÚC TRỌNG TÂM (${ls.section_code}):</div>
              <div style="font-family:var(--font-mincho); font-size:1.2rem; font-weight:700; margin-top:2px;">${this.escapeHtml(u.pattern_title)}</div>
              <p style="margin:6px 0; font-size:0.92rem;">${this.escapeHtml(u.rule_vi)}</p>
              <div style="font-size:0.8rem; color:var(--ink-muted); padding:6px 10px; background:var(--bg-paper-subtle); border-radius:4px;">
                <strong>Lưu ý chia thể / Ngoại lệ:</strong> ${this.escapeHtml(u.exception_note)}
              </div>
            </div>

            <!-- Step-by-step animated grammatical chain -->
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:8px;">
              ${u.steps.map((st, idx) => `
                <div style="padding:10px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-left:3px solid var(--accent-aizome); border-radius:4px;">

                  <div style="font-family:var(--font-mincho); font-size:1.1rem; font-weight:700; margin:4px 0;">${this.escapeHtml(st.form)}</div>
                  <div style="font-size:0.78rem; color:var(--ink-secondary);">${this.escapeHtml(st.note)}</div>

            <!-- CONTRAST LENS (対比レンズ) -->
            <div style="padding:12px; background:var(--bg-paper-subtle); border:1px solid var(--border-strong); border-radius:6px;">
              <div style="font-size:0.8rem; font-weight:700; color:var(--accent-shu); margin-bottom:8px;">
                対比レンズ · CONTRAST LENS: ${this.escapeHtml(cl.title_vi)}
              </div>
              <div class="contrast-grid">
                <div class="contrast-card">
                  <div style="font-size:0.72rem; font-weight:700; color:var(--accent-aizome);">TRƯỚC / CÁCH DÙNG A</div>
                  <div style="font-family:var(--font-mincho); font-size:1.08rem; font-weight:700; margin:4px 0;">${this.escapeHtml(cl.before_jp)}</div>
                  <div style="font-size:0.83rem; color:var(--ink-secondary);">${this.escapeHtml(cl.before_vi)}</div>
                </div>
                <div class="contrast-card" style="border-color:var(--accent-shu);">
                  <div style="font-size:0.72rem; font-weight:700; color:var(--accent-shu);">SAU / ĐỐI CHIẾU B (${this.escapeHtml(cl.diff_highlight)})</div>
                  <div style="font-family:var(--font-mincho); font-size:1.08rem; font-weight:700; margin:4px 0;">${this.escapeHtml(cl.after_jp)}</div>
                  <div style="font-size:0.83rem; color:var(--ink-secondary);">${this.escapeHtml(cl.after_vi)}</div>
                </div>
              </div>
              <div style="margin-top:8px; font-size:0.82rem; color:var(--ink-sumi);">
                <strong>Ngữ dụng học (Pragmatics):</strong> ${this.escapeHtml(cl.pragmatics_vi)}
              </div>
            </div>
          </div>
        `;
      }

      if (this.activeDimension === "MUTATE") {
        return `
          <div style="display:grid; gap:14px;">
            <div style="font-size:0.88rem; color:var(--ink-secondary);">
              <strong>Phòng thí nghiệm biến đổi câu có kiểm soát:</strong> Chọn một phép thay thế hợp lệ bên dưới để quan sát câu tiếng Nhật và nghĩa tiếng Việt chuyển đổi tức thì.
            </div>
            ${ls.mutations.map(m => `
              <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
                <div style="font-size:0.82rem; font-weight:700; color:var(--accent-aizome); margin-bottom:8px;">
                  ${this.escapeHtml(m.label_vi)} (Vị trí gốc: 「${this.escapeHtml(m.slot)}」)
                </div>
                <div style="display:grid; gap:8px;">
                  ${m.options.map((opt, oIdx) => `
                    <button class="btn-action" style="justify-content:space-between; text-align:left; width:100%; padding:10px 12px;"
                            onclick="KotoApp.applyMutation('${ls.id}', '${m.rule_id}', ${oIdx})">
                      <div>
                        <div style="font-family:var(--font-mincho); font-size:1.05rem; font-weight:700; color:var(--ink-sumi);">${this.escapeHtml(opt.result_jp)}</div>
                        <div style="font-size:0.82rem; color:var(--ink-secondary);">${this.escapeHtml(opt.result_vi)}</div>
                      </div>
                      <span class="badge-layer">Áp dụng →</span>
                    </button>
                  `).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      if (this.activeDimension === "LISTEN") {
        const lm = this.data.pedagogy.listening_microscope.find(x => x.lesson === ls.lesson)
          || this.data.pedagogy.listening_microscope[0];
        return `
          <div style="display:grid; gap:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div>
                <div style="font-size:0.78rem; font-weight:700; color:var(--accent-aizome);">耳のアトリエ · LISTENING MICROSCOPE (Bài ${lm.lesson})</div>
                <div style="font-size:0.82rem; color:var(--ink-muted);">
                  Trạng thái âm thanh: ${this.japaneseVoiceAvailable ? "Giọng đọc tiếng Nhật khả dụng (Web Speech API)" : "Chế độ phụ đề chuẩn + TTS trình duyệt dự phòng"}
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="btn-pill btn-primary" onclick="KotoApp.speakJapanese('${this.escapeHtml(lm.japanese)}', 1.0)">▶ Nghe 1.0x</button>
                <button class="btn-pill" onclick="KotoApp.speakJapanese('${this.escapeHtml(lm.japanese)}', 0.75)">🐢 Nghe 0.75x</button>
                <button class="btn-pill" onclick="KotoApp.openKanjiInInkStudio('${lm.focus_kanji}', null, 4)">
                  音から字へ · Viết chữ 「${lm.focus_kanji}」 từ âm thanh
                </button>
              </div>
            </div>

            <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
              <div style="font-size:0.82rem; color:var(--ink-secondary); margin-bottom:6px;">
                Nghe và gõ lại cụm từ còn thiếu (hoặc cả câu) để so sánh từng ký tự (Character-level Diff):
              </div>
              <div style="font-family:var(--font-mincho); font-size:1.2rem; font-weight:600; margin-bottom:6px;">
                ${this.escapeHtml(lm.japanese.replace(lm.hidden_span, "【 ＿＿＿ 】"))}
              </div>
              <div style="font-size:0.84rem; color:var(--ink-muted); margin-bottom:8px;">Nghĩa: ${this.escapeHtml(lm.vietnamese)}</div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" class="koto-input" style="flex:1; min-width:200px;"
                       placeholder="Gõ cụm từ nghe được (VD: ${this.escapeHtml(lm.hidden_span)})…"
                       value="${this.escapeHtml(this.dictationInput)}"
                       oninput="KotoApp.dictationInput = this.value" />
                <button class="btn-pill btn-primary" onclick="KotoApp.checkDictation('${lm.id}')">So khớp từng ký tự</button>
              </div>
              ${this.dictationFeedback ? `
                <div style="margin-top:8px; padding:8px; background:var(--bg-paper-elevated); border:1px solid var(--border-hairline); border-radius:4px;">
                  <div style="font-size:0.84rem; font-weight:600;">${this.dictationFeedback.htmlDiff}</div>
                  <div style="font-size:0.8rem; color:var(--ink-secondary); margin-top:4px;">
                    Câu đầy đủ: <strong>${this.escapeHtml(lm.japanese)}</strong> (${this.escapeHtml(lm.kana)})
                  </div>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }

      if (this.activeDimension === "SPEAK") {
        const kanjiInSentence = [];
        ls.tokens.forEach(t => {
          (t.kanji_chars || []).forEach(ch => {
            const rec = this.data.kanjiInventory.core_characters.find(c => c.character === ch);
            if (rec && !kanjiInSentence.some(x => x.character === ch)) kanjiInSentence.push(rec);
          });
        });

        return `
          <div style="display:grid; gap:12px;">
            <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
              <div style="font-size:0.82rem; font-weight:700; color:var(--accent-aizome); margin-bottom:6px;">
                話す · LUYỆN NÓI SHADOWING & TỰ ĐỐI CHIẾU (Không chấm điểm phát âm giả tạo)
              </div>
              <p style="margin:0 0 8px 0; font-size:0.86rem; color:var(--ink-secondary);">
                1. Nghe câu mẫu <strong>「${this.escapeHtml(ls.japanese)}」</strong> → 2. Bấm thu âm/nhẩm theo nhịp → 3. Tự đối chiếu trường âm và ngữ điệu.
              </p>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn-pill btn-primary" onclick="KotoApp.speakJapanese('${this.escapeHtml(ls.japanese)}', 1.0)">🔊 Nghe mẫu chuẩn</button>
                <button class="btn-pill ${this.isRecordingAudio ? 'btn-shu' : ''}" onclick="KotoApp.toggleVoicePractice()">
                  ${this.isRecordingAudio ? "⏹ Dừng & Lưu lượt tập nói" : "🎙 Bắt đầu tập nói (Shadowing)"}
                </button>
              </div>
              ${this.recordedAudioNote ? `<div style="margin-top:8px; font-size:0.82rem; color:var(--ink-bamboo); font-weight:600;">${this.escapeHtml(this.recordedAudioNote)}</div>` : ""}
            </div>

            <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
              <div style="font-size:0.82rem; font-weight:700; color:var(--accent-aizome); margin-bottom:6px;">
                書く · VIẾT HÁN TỰ TRONG CÂU NÀY TRỰC TIẾP VÀO PHÒNG MỰC TÀU:
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                ${kanjiInSentence.length > 0 ? kanjiInSentence.map(kc => `
                  <button class="btn-pill btn-primary" onclick="KotoApp.openKanjiInInkStudio('${kc.character}', null, 2)">
                    🖌 Luyện viết chữ 「${kc.character}」 (${kc.stroke_count} nét)
                  </button>
                `).join("") : `
                  <button class="btn-pill btn-primary" onclick="KotoApp.openKanjiInInkStudio('飲', 'kanji_row_L11_P1_06', 1)">
                    🖌 Mở Phòng Mực Tàu (飲 · 飲み物)
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }

      // Dimension 6: TRANSFER
      const tr = ls.transfer;
      const allBankTokens = [...tr.target_tokens, ...tr.distractor_tokens];
      return `
        <div style="display:grid; gap:12px;">
          <div style="font-size:0.8rem; font-weight:700; color:var(--accent-aizome);">
            使う · THỬ THÁCH CHUYỂN GIAO NGỮ CẢNH (TRANSFER TO NEW SITUATION)
          </div>
          <div style="padding:12px; background:var(--bg-washi); border-left:3px solid var(--accent-shu); border-radius:4px; font-size:0.92rem;">
            ${this.escapeHtml(tr.situation_vi)}
          </div>

          <!-- Token Assembly Bank -->
          <div>
            <div style="font-size:0.76rem; color:var(--ink-muted); margin-bottom:6px;">Chạm vào các mảnh từ bên dưới để ghép nhanh hoặc trực tiếp gõ tiếng Nhật vào ô:</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${allBankTokens.map(tk => `
                <button class="btn-pill" onclick="KotoApp.appendTransferToken('${this.escapeHtml(tk)}')">
                  + ${this.escapeHtml(tk)}
                </button>
              `).join("")}
              <button class="btn-pill" onclick="KotoApp.clearTransferInput()">Xóa ô nhập</button>
            </div>
          </div>

          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="koto-transfer-input" class="koto-input" style="flex:1; min-width:220px;"
                   placeholder="Nhập hoặc ghép câu tiếng Nhật của bạn tại đây…"
                   value="${this.escapeHtml(this.transferInput)}"
                   oncompositionstart="KotoApp.isComposingIME = true"
                   oncompositionend="KotoApp.isComposingIME = false; KotoApp.transferInput = this.value"
                   oninput="if(!KotoApp.isComposingIME) KotoApp.transferInput = this.value" />
            <button class="btn-pill btn-primary" onclick="KotoApp.submitTransfer('${ls.id}')">
              Kiểm tra & Lưu tiến độ SRS
            </button>
          </div>

          <div style="font-size:0.78rem; color:var(--ink-muted);">💡 Gợi ý: ${this.escapeHtml(tr.hint_vi)}</div>

          ${this.transferFeedback ? `
            <div style="padding:12px; border-radius:6px; border:1px solid ${this.transferFeedback.isCorrect ? 'var(--ink-bamboo)' : 'var(--accent-shu)'}; background:${this.transferFeedback.isCorrect ? 'var(--ink-bamboo-soft)' : 'var(--accent-shu-soft)'};">
              <div style="font-weight:700; font-size:0.9rem; color:${this.transferFeedback.isCorrect ? 'var(--ink-bamboo)' : 'var(--accent-shu)'};">
                ${this.escapeHtml(this.transferFeedback.feedbackVi)}
              </div>
              <div style="font-size:0.8rem; margin-top:4px; color:var(--ink-secondary);">
                Đã cập nhật lịch ôn tập SRS cho mục <code>${ls.grammar_id}</code> (Kỹ năng: <code>production</code>).
              </div>
            </div>
          ` : ""}
        </div>
      `;
    },

    renderInkStudioView() {
      const kRec = this.data.kanjiInventory.core_characters.find(c => c.character === this.currentKanjiChar)
        || this.data.kanjiInventory.core_characters[0];
      const rowsForChar = this.data.kanjiRows.teaching_rows.filter(r => r.constituent_kanji.includes(kRec.character));
      const activeRow = this.data.kanjiRows.teaching_rows.find(r => r.occurrence_id === this.currentKanjiRowId)
        || rowsForChar[0]
        || this.data.kanjiRows.teaching_rows[0];

      const hist = this.state.handwritingHistory[kRec.character] || {
        guideOpacity: 0.55,
        tracePasses: 0,
        unaidedPasses: 0
      };

      // Calculate effective guide opacity per 5-layer progression
      let effectiveGuideOpacity = 0;
      if (this.inkLayerStep === 1) effectiveGuideOpacity = 0.85;
      else if (this.inkLayerStep === 2) effectiveGuideOpacity = 0.52;
      else if (this.inkLayerStep === 3) effectiveGuideOpacity = hist.guideOpacity ?? 0.25;
      else if (this.inkLayerStep === 4) effectiveGuideOpacity = this.lastInkEvaluation && this.showReferenceOverlay ? this.overlayOpacity : 0.0;
      else if (this.inkLayerStep === 5) effectiveGuideOpacity = 0.35;

      const curLesson = this.state.preferences.activeLesson;
      const lessonChars = curLesson === "ALL"
        ? this.data.kanjiInventory.core_characters
        : this.data.kanjiInventory.core_characters.filter(c => c.lessons.includes(Number(curLesson)));

      const constituentCharsInRow = activeRow.constituent_kanji.map(ch =>
        this.data.kanjiInventory.core_characters.find(c => c.character === ch)
      ).filter(Boolean);

      return `
        <!-- KANJI LENS (漢字のレンズ) — Context-First Microscope -->
        <section class="paper-sheet" aria-label="Kanji Lens và Phòng Mực Tàu">
          <div class="paper-sheet-header">
            <div class="sheet-kicker">
              <span>漢字のレンズ & 漢字の書房 · KANJI LENS & INK STUDIO</span>
              <span class="badge-layer">119 dòng PDF · 118 từ · 109 chữ Hán cốt lõi</span>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-pill" onclick="KotoApp.toggleHandPreference()">
                Tay thuận: ${this.state.preferences.handPreference === "left" ? "Tay trái" : "Tay phải"}
              </button>
              <button class="btn-pill" onclick="KotoApp.toggleGenkoGrid()">
                Lưới Genkō: ${this.state.preferences.showGenkoGrid ? "Bật" : "Tắt"}
              </button>
              <button class="btn-pill btn-active" onclick="KotoApp.openKanjiInInkStudio('飲', 'kanji_row_L11_P1_06', 1)">
                Mẫu chuẩn: 飲み物 → 飲・物
              </button>
            </div>
          </div>

          <!-- Character Selector Ribbon for Active Lesson -->
          <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;">
            ${lessonChars.map(c => `
              <button class="lesson-chip ${c.character === kRec.character ? 'active' : ''}"
                      onclick="KotoApp.selectInkKanji('${c.character}')"
                      title="Chữ ${c.character} (${c.stroke_count} nét)">
                <span style="font-family:var(--font-mincho); font-size:1.1rem;">${c.character}</span>
                <span style="font-size:0.68rem; opacity:0.8; margin-left:3px;">${c.stroke_count}n</span>
              </button>
            `).join("")}
          </div>

          <!-- Kanji Lens Compound Header (Word-first context!) -->
          <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px; margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
              <div>
                <div style="font-size:0.74rem; color:var(--accent-aizome); font-weight:700;">
                  TỪ GHÉP GỐC TRONG PDF (Trang ${activeRow.pdf_page}, Dòng #${activeRow.page_row_index} · <code>${activeRow.occurrence_id}</code>)
                  ${activeRow.is_unnumbered_in_pdf ? `<span class="badge-layer" style="margin-left:6px;">Dòng không đánh số trong PDF gốc</span>` : ""}
                  ${activeRow.is_duplicate_expression ? `<span class="badge-layer" style="margin-left:6px;">Xuất hiện ở Trang 3 & Trang 7</span>` : ""}
                </div>
                <div style="display:flex; align-items:baseline; gap:12px; margin-top:4px; flex-wrap:wrap;">
                  <span style="font-family:var(--font-mincho); font-size:2rem; font-weight:700;">${this.escapeHtml(activeRow.written_expression)}</span>
                  <span style="font-size:1.15rem; font-weight:600; color:var(--accent-aizome);">【${this.escapeHtml(activeRow.kana_reading)}】</span>
                  <span class="badge-layer">${this.escapeHtml(activeRow.han_viet)}</span>
                </div>
                <div style="font-size:0.95rem; font-weight:600; margin-top:2px;">
                  Nghĩa tiếng Việt: ${this.escapeHtml(activeRow.vietnamese_meaning)}
                </div>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn-pill" onclick="KotoApp.speakJapanese('${this.escapeHtml(activeRow.written_expression)}', 0.9)">
                  🔊 Nghe từ 「${this.escapeHtml(activeRow.written_expression)}」
                </button>
              </div>
            </div>

            <!-- Compound Unfold (熟語をひらく): Constituent Kanji in this word -->
            <div style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-hairline); display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span style="font-size:0.78rem; color:var(--ink-muted); font-weight:600;">熟語をひらく · Tách chữ Hán trong từ này:</span>
              ${constituentCharsInRow.map(cc => `
                <button class="btn-pill ${cc.character === kRec.character ? 'btn-primary' : ''}"
                        onclick="KotoApp.selectInkKanji('${cc.character}', '${activeRow.occurrence_id}')">
                  Chữ 「${cc.character}」 (${cc.stroke_count} nét · ${this.escapeHtml(cc.han_viet_candidates.join("/") || "")})
                </button>
              `).join("")}
              <span style="font-size:0.76rem; color:var(--ink-muted);">
                | Các từ cùng chứa 「${kRec.character}」:
                ${rowsForChar.map(r => `
                  <button class="btn-pill" style="min-height:30px; padding:2px 8px; font-size:0.75rem;"
                          onclick="KotoApp.selectInkKanji('${kRec.character}', '${r.occurrence_id}')">
                    ${this.escapeHtml(r.written_expression)} (${this.escapeHtml(r.kana_reading)})
                  </button>
                `).join(" ")}
              </span>
            </div>
          </div>

          <!-- 4 Study Modes Switcher (E2) -->
          <div style="display:flex; gap:6px; overflow-x:auto; margin-bottom:10px;">
            ${[
              { id: "PROGRESSION", label: "Lộ trình 5 bước (Observe→Transfer)" },
              { id: "INK_RECALL", label: "墨の記憶 · Ink Recall (Viết không nhìn mẫu)" },
              { id: "SOUND_TO_INK", label: "音から字へ · Sound-to-Ink (Nghe âm viết chữ)" },
              { id: "COMPOUND_UNFOLD", label: "熟語をひらく · Compound Unfold" },
              { id: "ONE_MIN_INK", label: "一分の書 · One-Minute Ink (60s)" }
            ].map(m => `
              <button class="btn-pill ${this.inkStudyMode === m.id ? 'btn-active' : ''}"
                      onclick="KotoApp.setInkStudyMode('${m.id}')">
                ${m.label}
              </button>
            `).join("")}
          </div>

          <!-- 5-Layer Learning Progression Bar (E1) -->
          <div class="layer-progression" role="tablist" aria-label="5 bước học viết chữ Hán">
            ${[
              { step: 1, jp: "1. 見る", vi: "Quan sát" },
              { step: 2, jp: "2. なぞる", vi: "Đồ nét mẫu" },
              { step: 3, jp: "3. うすくする", vi: `Mờ dần (${Math.round((hist.guideOpacity ?? 0.25) * 100)}%)` },
              { step: 4, jp: "4. 思い出す", vi: "Nhớ lại (Trống)" },
              { step: 5, jp: "5. 使う", vi: "Ứng dụng từ" }
            ].map(st => `
              <button class="layer-step-btn ${this.inkLayerStep === st.step ? 'active' : ''}"
                      onclick="KotoApp.setInkLayerStep(${st.step})">
                <div>${st.jp}</div>
                <div style="font-size:0.65rem; opacity:0.9;">${st.vi}</div>
              </button>
            `).join("")}
          </div>

          <!-- GENKŌ-YŌSHI WRITING DESK -->
          <div class="ink-studio-layout ${this.state.preferences.handPreference === 'left' ? 'left-handed' : ''}" style="margin-top:14px;">
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px; align-items:start;">
              <!-- Left/Center: Interactive High-DPI Canvas Square -->
              <div class="genko-frame-wrap">
                <div style="font-size:0.78rem; font-weight:600; color:var(--ink-secondary); margin-bottom:6px; text-align:center;">
                  ${this.inkLayerStep === 4
                    ? `Nhớ lại chữ Hán trong từ: 「${this.escapeHtml(activeRow.written_expression.replace(kRec.character, "【 ？ 】"))}」 (${this.escapeHtml(activeRow.kana_reading)} — ${this.escapeHtml(activeRow.vietnamese_meaning)})`
                    : `Chữ mục tiêu: 「${kRec.character}」 · Tổng số nét chuẩn: ${kRec.stroke_count} nét`}
                </div>

                <div class="genko-canvas-box" id="koto-genko-box">
                  <!-- Genkō-Yōshi Orthogonal Hairline Grid -->
                  <svg class="genko-grid-svg" viewBox="0 0 109 109" style="opacity:${this.state.preferences.showGenkoGrid ? 1 : 0};">
                    <line x1="54.5" y1="0" x2="54.5" y2="109" stroke="var(--border-hairline)" stroke-width="0.7" stroke-dasharray="2.5,2.5"/>
                    <line x1="0" y1="54.5" x2="109" y2="54.5" stroke="var(--border-hairline)" stroke-width="0.7" stroke-dasharray="2.5,2.5"/>
                    <rect x="10" y="10" width="89" height="89" fill="none" stroke="var(--border-hairline)" stroke-width="0.4" opacity="0.6"/>
                  </svg>

                  <!-- Guide / Reference Overlay SVG (109x109 JIS space) -->
                  <svg class="genko-guide-svg" id="koto-guide-svg" viewBox="0 0 109 109" style="opacity:${effectiveGuideOpacity};">
                    ${this.renderKanjiGuideSVGContent(kRec)}
                  </svg>

                  <!-- Interactive Pointer Events Canvas -->
                  <canvas class="genko-canvas" id="koto-ink-canvas" width="327" height="327"
                          aria-label="Ô luyện viết chữ Hán ${kRec.character}"></canvas>
                </div>

                <div class="ink-controls-row" style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:10px; width:100%;">
                  <button class="btn-pill" onclick="KotoApp.animateStrokeOrder()">▶ Phát thứ tự nét</button>
                  <button class="btn-pill" onclick="KotoApp.undoLastStroke()">↶ Hoàn tác nét</button>
                  <button class="btn-pill" onclick="KotoApp.clearInkCanvas()">✕ Xóa giấy</button>
                  <button class="btn-pill btn-primary" onclick="KotoApp.evaluateCurrentInk()">
                    ✓ Kiểm tra & Đối chiếu (${this.userStrokes109.length}/${kRec.stroke_count} nét)
                  </button>
                </div>
              </div>

              <!-- Right: Stroke Metadata, Honest Verification Status & Step 5 Transfer -->
              <div style="display:flex; flex-direction:column; gap:10px;">
                <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.75rem; font-weight:700; color:var(--accent-aizome);">TRẠNG THÁI DỮ LIỆU NÉT (PROVENANCE):</span>
                    <span class="badge-layer">${kRec.verified_stroke_reference_available ? "SVG + JStroke Verified" : "JStroke + Freehand Overlay"}</span>
                  </div>
                  <div style="font-size:0.82rem; color:var(--ink-secondary); margin-top:6px;">
                    <strong>Chữ Hán:</strong> <span style="font-family:var(--font-mincho); font-size:1.3rem; font-weight:700;">${this.inkLayerStep === 4 && !this.lastInkEvaluation ? "【 Đang ẩn để nhớ lại 】" : kRec.character}</span>
                    (${kRec.unicode_hex}) · <strong>Số nét:</strong> ${kRec.stroke_count} nét
                  </div>
                  <div style="font-size:0.78rem; color:var(--ink-muted); margin-top:4px;">
                    <strong>Nguồn kiểm chứng:</strong> ${this.escapeHtml(kRec.stroke_source_license)}
                  </div>

                  <!-- Ordered Stroke Direction Pills from kanji.hwd -->
                  <div style="margin-top:8px;">
                    <div style="font-size:0.74rem; font-weight:600; color:var(--ink-muted); margin-bottom:4px;">
                      Trình tự ${kRec.stroke_count} nét chuẩn:
                    </div>
                    <div style="display:flex; gap:4px; flex-wrap:wrap;">
                      ${(kRec.stroke_directions || []).map((sd, idx) => `
                        <span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; border:1px solid ${idx < this.userStrokes109.length ? 'var(--ink-bamboo)' : 'var(--border-hairline)'}; background:${idx < this.userStrokes109.length ? 'var(--ink-bamboo-soft)' : 'var(--bg-paper-elevated)'};"
                              title="${this.escapeHtml(sd.description_vi)}">
                          Nét ${sd.stroke_index}: ${this.escapeHtml(sd.description_vi.replace("Nét ", ""))}
                        </span>
                      `).join("")}
                    </div>
                  </div>
                </div>

                <!-- Evaluation Feedback & Humane Self-Assessment Override -->
                ${this.lastInkEvaluation ? `
                  <div style="padding:12px; border-radius:6px; border:1px solid ${this.lastInkEvaluation.passedHeuristic ? 'var(--ink-bamboo)' : 'var(--accent-shu)'}; background:${this.lastInkEvaluation.passedHeuristic ? 'var(--ink-bamboo-soft)' : 'var(--accent-shu-soft)'};">
                    <div style="font-size:0.84rem; font-weight:700; margin-bottom:4px;">
                      KẾT QUẢ PHÂN TÍCH NÉT VIẾT (Độ tin cậy: ${this.lastInkEvaluation.confidence}):
                    </div>
                    <ul style="margin:4px 0 8px 18px; padding:0; font-size:0.84rem;">
                      ${this.lastInkEvaluation.messagesVi.map(m => `<li>${this.escapeHtml(m)}</li>`).join("")}
                    </ul>
                    <div style="font-size:0.78rem; color:var(--ink-secondary); margin-bottom:6px;">
                      <strong>Tự đánh giá & Ghi nhận SRS (Không ép điểm máy móc):</strong>
                    </div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                      <button class="btn-pill" onclick="KotoApp.recordInkSRS(1)">Quên (Lặp lại)</button>
                      <button class="btn-pill" onclick="KotoApp.recordInkSRS(2)">Khó (Cần luyện thêm)</button>
                      <button class="btn-pill btn-primary" onclick="KotoApp.recordInkSRS(3)">Nhớ (Đã viết đúng)</button>
                      <button class="btn-pill" onclick="KotoApp.recordInkSRS(4)">Dễ · Chuyển sang Bước 5 →</button>
                    </div>
                  </div>
                ` : ""}

                <!-- Step 5: Transfer to Full Word Reading (E1 Step 5 & E6 Required Demo Path) -->
                <div style="padding:12px; background:var(--bg-washi); border:1px solid var(--accent-aizome-border); border-radius:6px;">
                  <div style="font-size:0.8rem; font-weight:700; color:var(--accent-aizome); margin-bottom:6px;">
                    5. 使う · ỨNG DỤNG TRỞ LẠI TỪ GHÉP GỐC (WORD READING TRANSFER):
                  </div>
                  <div style="font-size:0.86rem; margin-bottom:8px;">
                    Sau khi luyện chữ <strong>「${kRec.character}」</strong>, hãy nhập cách đọc Hiragana đầy đủ của từ <strong>「${this.escapeHtml(activeRow.written_expression)}」</strong> (${this.escapeHtml(activeRow.vietnamese_meaning)}):
                  </div>
                  <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <input type="text" class="koto-input" style="flex:1; min-width:160px;"
                           placeholder="Nhập cách đọc kana (VD: ${this.escapeHtml(activeRow.kana_reading)})…"
                           value="${this.escapeHtml(this.transferReadingInput)}"
                           oninput="KotoApp.transferReadingInput = this.value" />
                    <button class="btn-pill btn-primary" onclick="KotoApp.verifyInkWordTransfer('${activeRow.occurrence_id}', '${kRec.character}')">
                      Xác nhận đọc & Lên lịch SRS
                    </button>
                  </div>
                  ${this.transferReadingFeedback ? `
                    <div style="margin-top:6px; font-size:0.84rem; font-weight:600; color:${this.transferReadingFeedback.ok ? 'var(--ink-bamboo)' : 'var(--accent-shu)'};">
                      ${this.escapeHtml(this.transferReadingFeedback.msg)}
                    </div>
                  ` : ""}
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    },

    renderKanjiGuideSVGContent(kRec) {
      if (kRec.verified_stroke_reference_available && kRec.svg_strokes_109) {
        return kRec.svg_strokes_109.map((pts, idx) => {
          const d = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p[0]} ${p[1]}`).join(" ");
          const start = pts[0];
          const isCurrentHint = this.inkLayerStep === 2 && idx === this.userStrokes109.length;
          const color = isCurrentHint ? "var(--accent-shu)" : "var(--ink-sumi)";
          return `
            <g class="guide-stroke-group" data-stroke="${idx + 1}">
              <path d="${d}" fill="none" stroke="${color}" stroke-width="${isCurrentHint ? 4.5 : 3.6}" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="${start[0]}" cy="${start[1]}" r="2.2" fill="var(--accent-shu)" />
              <text x="${Math.max(4, start[0] - 5)}" y="${Math.max(9, start[1] - 4)}" font-size="6.2" font-weight="bold" fill="var(--accent-aizome)">${idx + 1}</text>
            </g>
          `;
        }).join("");
      }
      // Honest Fallback: High-DPI Noto Serif CJK JP Glyph Reference
      return `
        <text x="54.5" y="84" text-anchor="middle" font-family="var(--font-mincho)" font-size="82" fill="var(--ink-sumi)">${kRec.character}</text>
      `;
    },

    renderKaiwaAndShardsView() {
      const curLesson = this.state.preferences.activeLesson;
      const scenes = curLesson === "ALL"
        ? this.data.pedagogy.kaiwa_scenes
        : this.data.pedagogy.kaiwa_scenes.filter(k => k.lesson === Number(curLesson));
      const scene = this.data.pedagogy.kaiwa_scenes.find(k => k.id === this.currentKaiwaId)
        || scenes[0]
        || this.data.pedagogy.kaiwa_scenes[0];

      return `
        <section class="paper-sheet" aria-label="Sân khấu Hội thoại và Tình huống ngắn">
          <div class="paper-sheet-header">
            <div class="sheet-kicker">
              <span>会話の舞台 · KAIWA THEATER & REALITY SHARDS</span>
              <span class="badge-layer">16 Kịch bản Kaiwa · 8 Tình huống · 4 Bài đọc · Sổ tay</span>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn-pill ${this.kaiwaSubTab === 'KAIWA' ? 'btn-active' : ''}" onclick="KotoApp.setKaiwaSubTab('KAIWA')">会話の舞台 · Hội thoại (16)</button>
              <button class="btn-pill ${this.kaiwaSubTab === 'SHARDS' ? 'btn-active' : ''}" onclick="KotoApp.setKaiwaSubTab('SHARDS')">Tình huống ngắn (8)</button>
              <button class="btn-pill ${this.kaiwaSubTab === 'DOKKAI' ? 'btn-active' : ''}" onclick="KotoApp.setKaiwaSubTab('DOKKAI')">読解 · Đọc hiểu (4)</button>
              <button class="btn-pill ${this.kaiwaSubTab === 'NOTEBOOK' ? 'btn-active' : ''}" onclick="KotoApp.setKaiwaSubTab('NOTEBOOK')">わたしの日本語 · Sổ tay</button>
            </div>
          </div>

          ${this.kaiwaSubTab === "KAIWA" ? this.renderKaiwaTheaterContent(scenes, scene) : ""}
          ${this.kaiwaSubTab === "SHARDS" ? this.renderRealityShardsContent() : ""}
          ${this.kaiwaSubTab === "DOKKAI" ? this.renderDokkaiContent() : ""}
          ${this.kaiwaSubTab === "NOTEBOOK" ? this.renderNotebookContent() : ""}
        </section>
      `;
    },

    renderKaiwaTheaterContent(scenes, scene) {
      return `
        <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;">
          ${scenes.map(sc => `
            <button class="btn-pill ${sc.id === scene.id ? 'btn-active' : ''}"
                    onclick="KotoApp.selectKaiwaScene('${sc.id}')">
              Bài ${sc.lesson}: ${this.escapeHtml(sc.title_vi)}
            </button>
          `).join("")}
        </div>

        <div style="padding:10px 12px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <span class="badge-layer">Luyện mở rộng (${scene.layer})</span>
            <strong style="margin-left:6px; font-size:0.9rem;">${this.escapeHtml(scene.title_vi)}</strong>
            <div style="font-size:0.8rem; color:var(--ink-secondary); margin-top:2px;">Mục tiêu: ${this.escapeHtml(scene.communicative_goal_vi)}</div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn-pill ${this.kaiwaListenFirstHideText ? 'btn-shu' : ''}"
                    onclick="KotoApp.kaiwaListenFirstHideText = !KotoApp.kaiwaListenFirstHideText; KotoApp.render();">
              ${this.kaiwaListenFirstHideText ? "👁 Hiện kịch bản chữ" : "🎧 Nghe trước (Ẩn chữ)"}
            </button>
            <button class="btn-pill ${this.kaiwaRoleMode === 'ROLE_B' ? 'btn-active' : ''}"
                    onclick="KotoApp.kaiwaRoleMode = KotoApp.kaiwaRoleMode === 'ROLE_B' ? 'BOTH' : 'ROLE_B'; KotoApp.render();">
              🎭 ${this.kaiwaRoleMode === "ROLE_B" ? "Đang đóng vai B (Ẩn lời B)" : "Nhập vai: Đóng vai B"}
            </button>
          </div>
        </div>

        <div class="kaiwa-stage">
          ${scene.turns.map(t => {
            const roleInfo = scene.roles.find(r => r.id === t.speaker) || { name_jp: t.speaker, name_vi: t.speaker };
            const isHiddenRoleB = this.kaiwaRoleMode === "ROLE_B" && t.speaker === "B";
            const chosenBranchId = this.kaiwaSelectedBranches[`${scene.id}_${t.turn_id}`];
            const chosenBranch = t.branches ? t.branches.find(b => b.choice_id === chosenBranchId) : null;

            return `
              <div class="kaiwa-turn speaker-${t.speaker}">
                <div class="kaiwa-speaker-col">
                  <div>${this.escapeHtml(roleInfo.name_jp)}</div>
                  <div style="font-family:var(--font-gothic); font-size:0.68rem; font-weight:400; color:var(--ink-muted);">${this.escapeHtml(roleInfo.name_vi)}</div>
                </div>
                <div>
                  ${this.kaiwaListenFirstHideText || isHiddenRoleB ? `
                    <div style="padding:8px; background:var(--bg-paper-subtle); border-radius:4px; font-size:0.85rem; color:var(--ink-muted);">
                      [Lời thoại đang ẩn để luyện nghe / nhập vai — Bấm 🔊 Nghe lượt thoại hoặc chọn nhánh trả lời bên dưới]
                    </div>
                  ` : `
                    <div style="font-family:var(--font-mincho); font-size:1.12rem; font-weight:600;">${this.escapeHtml(t.japanese)}</div>
                    <div style="font-size:0.8rem; color:var(--accent-aizome); margin-top:2px;">${this.escapeHtml(t.kana)}</div>
                    <div style="font-size:0.88rem; color:var(--ink-secondary); margin-top:4px;">${this.escapeHtml(t.vietnamese)}</div>
                  `}

                  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
                    <button class="btn-pill" style="min-height:34px; padding:3px 8px;" onclick="KotoApp.speakJapanese('${this.escapeHtml(t.japanese)}', 1.0)">🔊 Nghe</button>
                    <button class="btn-pill" style="min-height:34px; padding:3px 8px;" onclick="KotoApp.speakJapanese('${this.escapeHtml(t.japanese)}', 0.75)">🐢 Shadow chậm</button>
                    ${t.living_sentence_id ? `
                      <button class="btn-pill" style="min-height:34px; padding:3px 8px;" onclick="KotoApp.openLivingSentenceById('${t.living_sentence_id}')">
                        文のアトリエ · Mổ xẻ câu này
                      </button>
                    ` : ""}
                    <button class="btn-pill" style="min-height:34px; padding:3px 8px;" onclick="KotoApp.flagKaiwaTurnForReview('${scene.id}', '${t.turn_id}', '${this.escapeHtml(t.japanese)}')">
                      + Đánh dấu ôn tập SRS
                    </button>
                  </div>

                  <!-- Branching Conversation Choices -->
                  ${t.branches ? `
                    <div style="margin-top:10px; padding:10px; background:var(--bg-paper-subtle); border-radius:6px;">
                      <div style="font-size:0.76rem; font-weight:700; color:var(--accent-aizome); margin-bottom:6px;">
                        RẼ NHÁNH HỘI THOẠI (Chọn cách đáp của bạn để xem phản hồi tiếp theo):
                      </div>
                      <div style="display:grid; gap:6px;">
                        ${t.branches.map(b => `
                          <button class="btn-action ${chosenBranchId === b.choice_id ? 'btn-active' : ''}"
                                  style="justify-content:flex-start; text-align:left; width:100%;"
                                  onclick="KotoApp.selectKaiwaBranch('${scene.id}', '${t.turn_id}', '${b.choice_id}')">
                            <div>
                              <div style="font-family:var(--font-mincho); font-weight:700;">${this.escapeHtml(b.label_jp)}</div>
                              <div style="font-size:0.78rem; color:var(--ink-secondary);">${this.escapeHtml(b.label_vi)}</div>
                            </div>
                          </button>
                        `).join("")}
                      </div>
                      ${chosenBranch ? `
                        <div style="margin-top:8px; padding:8px; background:var(--bg-paper-elevated); border-left:3px solid var(--ink-bamboo); border-radius:4px;">
                          <div style="font-size:0.8rem; font-weight:700; color:var(--ink-bamboo);">${this.escapeHtml(chosenBranch.feedback_vi)}</div>
                          <div style="margin-top:6px; font-size:0.76rem; color:var(--ink-muted);">Lượt đáp tiếp theo của ${this.escapeHtml(scene.roles[0].name_jp)}:</div>
                          <div style="font-family:var(--font-mincho); font-size:1.04rem; font-weight:600;">${this.escapeHtml(chosenBranch.next_A_response.japanese)}</div>
                          <div style="font-size:0.82rem; color:var(--ink-secondary);">${this.escapeHtml(chosenBranch.next_A_response.vietnamese)}</div>
                        </div>
                      ` : ""}
                    </div>
                  ` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    },

    renderRealityShardsContent() {
      const shards = this.data.pedagogy.reality_shards;
      const shard = shards.find(s => s.id === this.currentShardId) || shards[0];
      const st = shard.states.find(x => x.state_id === this.currentShardStateId) || shard.states[0];

      return `
        <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;">
          ${shards.map(sh => `
            <button class="btn-pill ${sh.id === shard.id ? 'btn-active' : ''}"
                    onclick="KotoApp.selectRealityShard('${sh.id}')">
              Bài ${sh.lesson}: ${this.escapeHtml(sh.title_vi)}
            </button>
          `).join("")}
        </div>

        <div style="padding:14px; background:var(--bg-washi); border:1px solid var(--border-hairline); border-radius:6px;">

    renderLibraryVocabTable(curLesson, q) {
      let list = this.data.vocabulary;
      if (curLesson !== "ALL") list = list.filter(v => v.lesson === Number(curLesson));
      if (q) {
        list = list.filter(v =>
          v.kana.toLowerCase().includes(q) ||
          (v.kanji && v.kanji.toLowerCase().includes(q)) ||
          v.romaji.toLowerCase().includes(q) ||
          v.vietnamese_meaning.toLowerCase().includes(q) ||
          v.english_gloss.toLowerCase().includes(q) ||
          v.occurrence_id.toLowerCase().includes(q)
        );
      }

    // --- Interactive Action Handlers ---
    selectLivingSentence(lsId) {
      this.currentSentenceId = lsId;
      this.selectedTokenIndex = 0;
      this.activeMutationText = null;
      this.transferInput = "";
      this.transferFeedback = null;
      this.render();
    },

    selectToken(idx) {
      this.selectedTokenIndex = idx;
      this.activeDimension = "SEE";
      this.render();
    },

    setDimension(dim) {
      this.activeDimension = dim;
      this.render();
    },

    toggleXRay() {
      this.xrayEnabled = !this.xrayEnabled;
      this.render();
    },

    togglePerspective17() {
      this.perspectiveMode17 = this.perspectiveMode17 === "GIVE" ? "RECEIVE" : "GIVE";
      this.perspectiveFeedback17 = null;
      this.render();
    },

    checkPerspective17() {
      const targetAccepted = this.perspectiveMode17 === "GIVE"
        ? [
            "さとうさんは ジョイさんに 花を もらいます。",
            "さとうさんはジョイさんに花をもらいます。",
            "さとうさんは ジョイさんから 花を もらいます。",
            "さとうさんは ジョイさんに はなを もらいます。"
          ]
        : [
            "ジョイさんは さとうさんに 花を あげます。",
            "ジョイさんはさとうさんに花をあげます。",
            "ジョイさんは さとうさんに はなを あげます。"
          ];
      this.perspectiveFeedback17 = global.KotoSRS.evaluateJapaneseProduction(this.perspectiveInput17, targetAccepted);
      this.render();
    },

    applyMutation(lsId, ruleId, optIdx) {
      const ls = this.data.pedagogy.living_sentences.find(s => s.id === lsId);
      if (!ls) return;
      const rule = ls.mutations.find(m => m.rule_id === ruleId);
      if (!rule || !rule.options[optIdx]) return;
      this.activeMutationText = rule.options[optIdx];
      this.render();
    },

    resetMutation() {
      this.activeMutationText = null;
      this.render();
    },

    checkDictation(lmId) {
      const lm = this.data.pedagogy.listening_microscope.find(x => x.id === lmId);
      if (!lm) return;
      const input = global.KotoSRS.normalizeJapaneseStrict(this.dictationInput);
      const targetSpan = global.KotoSRS.normalizeJapaneseStrict(lm.hidden_span);
      const targetFull = global.KotoSRS.normalizeJapaneseStrict(lm.japanese);

      const ref = input.length > targetSpan.length + 3 ? targetFull : targetSpan;
      let html = "";
      const maxLen = Math.max(input.length, ref.length);
      for (let i = 0; i < maxLen; i++) {
        const uCh = input[i] || "＿";
        const rCh = ref[i] || "";
        if (uCh === rCh) {
          html += `<span style="color:var(--ink-bamboo);">${this.escapeHtml(uCh)}</span>`;
        } else {
          html += `<span style="color:var(--accent-shu); text-decoration:underline;" title="Chuẩn: ${this.escapeHtml(rCh)}">${this.escapeHtml(uCh)}</span>`;
        }
      }
      this.dictationFeedback = { htmlDiff: `Đối chiếu từng ký tự: ${html}` };
      this.render();
    },

    toggleVoicePractice() {
      this.isRecordingAudio = !this.isRecordingAudio;
      if (!this.isRecordingAudio) {
        this.recordedAudioNote = "Đã hoàn thành lượt tập nói Shadowing! Hãy nghe lại câu mẫu để tự kiểm tra nhịp ngắt và trường âm.";
      }
      this.render();
    },

    appendTransferToken(tk) {
      this.transferInput = (this.transferInput ? this.transferInput + " " : "") + tk;
      this.render();
    },

    clearTransferInput() {
      this.transferInput = "";
      this.transferFeedback = null;
      this.render();
    },

    submitTransfer(lsId) {
      const ls = this.data.pedagogy.living_sentences.find(s => s.id === lsId);
      if (!ls) return;
      const res = global.KotoSRS.evaluateJapaneseProduction(this.transferInput, ls.transfer.accepted_answers);
      this.transferFeedback = res;
      global.KotoSRS.scheduleSRSReview(
        this.state,
        ls.grammar_id,
        "production",
        res.isCorrect ? 3 : 1,
        {
          format: "transfer_sentence",
          prompt: ls.transfer.situation_vi,
          expected: ls.transfer.accepted_answers[0],
          userResponse: this.transferInput,
          diagnostic: res.feedbackVi
        }
      );
      if (!res.isCorrect && res.confusionCategory) {
        global.KotoSRS.recordConfusion(
          this.state,
          ls.grammar_id,
          ls.section_code,
          res.confusionCategory,
          res.feedbackVi
        );
      }
      this.render();
    },

    // --- Kanji Ink Studio Handlers ---
    selectInkKanji(ch, rowId = null) {
      this.currentKanjiChar = ch;
      if (rowId) this.currentKanjiRowId = rowId;
      else {
        const kRec = this.data.kanjiInventory.core_characters.find(c => c.character === ch);
        if (kRec && kRec.source_row_occurrence_ids.length > 0) {
          this.currentKanjiRowId = kRec.source_row_occurrence_ids[0];
        }
      }
      this.userStrokes109 = [];
      this.lastInkEvaluation = null;
      this.transferReadingInput = "";
      this.transferReadingFeedback = null;
      this.render();
    },

    setInkStudyMode(mode) {
      this.inkStudyMode = mode;
      if (mode === "INK_RECALL") this.inkLayerStep = 4;
      else if (mode === "SOUND_TO_INK") {
        this.inkLayerStep = 4;
        const activeRow = this.data.kanjiRows.teaching_rows.find(r => r.occurrence_id === this.currentKanjiRowId);
        if (activeRow) this.speakJapanese(activeRow.written_expression, 0.9);
      } else if (mode === "COMPOUND_UNFOLD") {
        this.inkLayerStep = 2;
      } else if (mode === "ONE_MIN_INK") {
        this.startSessionTimer("60s");
        return;
      }
      this.render();
    },

    setInkLayerStep(step) {
      this.inkLayerStep = step;
      this.lastInkEvaluation = null;
      this.render();
    },

    toggleHandPreference() {
      this.state.preferences.handPreference = this.state.preferences.handPreference === "left" ? "right" : "left";
      global.KotoSRS.saveState(this.state);
      this.render();
    },

    toggleGenkoGrid() {
      this.state.preferences.showGenkoGrid = !this.state.preferences.showGenkoGrid;
      global.KotoSRS.saveState(this.state);
      this.render();
    },

    mountInkCanvasEvents() {
      const canvas = document.getElementById("koto-ink-canvas");
      if (!canvas) return;

      const to109 = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / (rect.width || 1)) * 109;
        const y = ((e.clientY - rect.top) / (rect.height || 1)) * 109;
        return [
          Number(Math.max(0, Math.min(109, x)).toFixed(2)),
          Number(Math.max(0, Math.min(109, y)).toFixed(2))
        ];
      };

      canvas.onpointerdown = (e) => {
        e.preventDefault();
        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}
        this.isDrawingPointer = true;
        this.currentPointerStroke = [to109(e)];
        this.redrawInkCanvas();
      };

      canvas.onpointermove = (e) => {
        if (!this.isDrawingPointer) return;
        e.preventDefault();
        const pt = to109(e);
        const last = this.currentPointerStroke[this.currentPointerStroke.length - 1];
        if (!last || Math.hypot(pt[0] - last[0], pt[1] - last[1]) > 0.8) {
          this.currentPointerStroke.push(pt);
          this.redrawInkCanvas();
        }
      };

      const finishStroke = (e) => {
        if (!this.isDrawingPointer) return;
        this.isDrawingPointer = false;
        if (this.currentPointerStroke.length >= 2) {
          this.userStrokes109.push(this.currentPointerStroke);
        }
        this.currentPointerStroke = [];
        this.redrawInkCanvas();
      };

      canvas.onpointerup = finishStroke;
      canvas.onpointercancel = finishStroke;
    },

    redrawInkCanvas() {
      const canvas = document.getElementById("koto-ink-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const scale = w / 109;

      ctx.clearRect(0, 0, w, h);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const isDark = this.state.preferences.theme === "dark";
      const strokeColor = isDark ? "#76A5C8" : "#22272B";

      const drawPolyline = (pts, color, width) => {
        if (!pts || pts.length === 0) return;
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.moveTo(pts[0][0] * scale, pts[0][1] * scale);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i][0] * scale, pts[i][1] * scale);
        }
        ctx.stroke();
      };

      this.userStrokes109.forEach((s, idx) => {
        drawPolyline(s, strokeColor, 9.5);
        // Small stroke number badge at start of learner stroke
        ctx.fillStyle = "#AC493D";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(String(idx + 1), s[0][0] * scale - 4, s[0][1] * scale - 6);
      });

      if (this.currentPointerStroke && this.currentPointerStroke.length > 1) {
        drawPolyline(this.currentPointerStroke, "#AC493D", 10.5);
      }
    },

    undoLastStroke() {
      if (this.userStrokes109.length > 0) {
        this.userStrokes109.pop();
        this.lastInkEvaluation = null;
        this.render();
      }
    },

    clearInkCanvas() {
      this.userStrokes109 = [];
      this.currentPointerStroke = [];
      this.lastInkEvaluation = null;
      this.render();
    },

    animateStrokeOrder() {
      const svg = document.getElementById("koto-guide-svg");
      if (!svg) return;
      svg.style.opacity = "0.92";
      const groups = svg.querySelectorAll(".guide-stroke-group");
      if (!groups || groups.length === 0) {
        this.showToast("Chữ này đang ở chế độ đối chiếu hình dáng chuẩn Noto Serif JP. Đã hiển thị rõ chữ mẫu.");
        return;
      }
      groups.forEach(g => { g.style.opacity = "0.12"; });
      groups.forEach((g, idx) => {
        setTimeout(() => {
          g.style.opacity = "1";
        }, idx * 280);
      });
    },

    evaluateCurrentInk() {
      const kRec = this.data.kanjiInventory.core_characters.find(c => c.character === this.currentKanjiChar)
        || this.data.kanjiInventory.core_characters[0];
      const evalRes = global.KotoHandwriting.evaluateHandwritingAttempt(kRec, this.userStrokes109);
      this.lastInkEvaluation = evalRes;

      // Update progressive fade opacity in handwritingHistory
      const prev = this.state.handwritingHistory[kRec.character] || {
        guideOpacity: 0.55,
        tracePasses: 0,
        unaidedPasses: 0
      };
      if (evalRes.passedHeuristic) {
        if (this.inkLayerStep <= 3) {
          prev.tracePasses += 1;
          prev.guideOpacity = Number(Math.max(0.04, prev.guideOpacity * 0.55).toFixed(2));
        } else {
          prev.unaidedPasses += 1;
        }
      }
      this.state.handwritingHistory[kRec.character] = prev;
      global.KotoSRS.saveState(this.state);
      this.render();
    },

    recordInkSRS(grade) {
      const kRec = this.data.kanjiInventory.core_characters.find(c => c.character === this.currentKanjiChar);
      if (!kRec) return;
      const isAssisted = this.inkLayerStep < 4;
      global.KotoSRS.scheduleSRSReview(
        this.state,
        kRec.kanji_id,
        "character_writing",
        grade,
        {
          assisted: isAssisted,
          format: isAssisted ? "guided_trace" : "unaided_recall",
          prompt: `Viết chữ Hán ${kRec.character}`
        }
      );
      if (grade >= 3 && this.inkLayerStep < 5) {
        this.inkLayerStep += 1;
      }
      this.showToast(
        isAssisted
          ? `Đã lưu lượt tập đồ nét (Có hỗ trợ). Hãy qua Bước 4 (Nhớ lại) để xác nhận thuộc mặt chữ độc lập!`
          : `Đã cập nhật lịch ôn tập SRS (Kỹ năng: character_writing) cho chữ 「${kRec.character}」!`
      );
      this.render();
    },

    verifyInkWordTransfer(rowId, kanjiChar) {
      const row = this.data.kanjiRows.teaching_rows.find(r => r.occurrence_id === rowId);
      if (!row) return;
      const acceptedReadings = row.kana_reading.split("／").map(s => s.trim());
      const normUser = global.KotoSRS.normalizeJapaneseStrict(this.transferReadingInput);
      const ok = acceptedReadings.some(acc => normUser === global.KotoSRS.normalizeJapaneseStrict(acc))
        || normUser === global.KotoSRS.normalizeJapaneseStrict(row.written_expression);

      this.transferReadingFeedback = {
        ok,
        msg: ok
          ? `✓ Chính xác! Cách đọc của 「${row.written_expression}」 là 「${row.kana_reading}」 (${row.vietnamese_meaning}). Đã ghi nhận SRS cho cả kỹ năng đọc từ và viết chữ!`
          : `✕ Chưa khớp. Cách đọc chuẩn của 「${row.written_expression}」 trong PDF là 「${row.kana_reading}」.`
      };

      global.KotoSRS.scheduleSRSReview(
        this.state,
        row.occurrence_id,
        "word_reading",
        ok ? 4 : 1,
        {
          assisted: false,
          format: "ink_to_word_transfer",
          prompt: `Cách đọc của ${row.written_expression}`,
          expected: row.kana_reading,
          userResponse: this.transferReadingInput
        }
      );
      this.render();
    },

    // --- Kaiwa / Shards / Notebook Handlers ---
    setKaiwaSubTab(tab) {
      this.kaiwaSubTab = tab;
      this.render();
    },

    openKaiwaForLesson(lessonNum) {
      this.pushNavContext();
      this.state.preferences.activeLesson = lessonNum;
      const sc = this.data.pedagogy.kaiwa_scenes.find(k => k.lesson === Number(lessonNum));
      if (sc) this.currentKaiwaId = sc.id;
      this.kaiwaSubTab = "KAIWA";
      this.activeView = "kaiwa";
      this.render();
    },

    openShardForLesson(lessonNum) {
      this.pushNavContext();
      this.state.preferences.activeLesson = lessonNum;
      const sh = this.data.pedagogy.reality_shards.find(s => s.lesson === Number(lessonNum));
      if (sh) {
        this.currentShardId = sh.id;
        this.currentShardStateId = sh.states[0].state_id;
      }
      this.kaiwaSubTab = "SHARDS";
      this.activeView = "kaiwa";
      this.render();
    },

    selectKaiwaScene(id) {
      this.currentKaiwaId = id;
      this.render();
    },

    selectKaiwaBranch(sceneId, turnId, choiceId) {
      this.kaiwaSelectedBranches[`${sceneId}_${turnId}`] = choiceId;
      this.render();
    },

    flagKaiwaTurnForReview(sceneId, turnId, jpText) {
      global.KotoSRS.scheduleSRSReview(
        this.state,
        `${sceneId}_${turnId}`,
        "meaning_in_context",
        2,
        {
          prompt: `Lượt thoại cần ôn lại: ${jpText}`,
          expected: jpText
        }
      );
      this.showToast("Đã thêm lượt thoại này vào danh sách Ôn tập SRS (Memory Weave)!");
      this.render();
    },

    selectRealityShard(id) {
      this.currentShardId = id;
      const sh = this.data.pedagogy.reality_shards.find(s => s.id === id);
      if (sh) this.currentShardStateId = sh.states[0].state_id;
      this.render();
    },

    selectShardState(stId) {
      this.currentShardStateId = stId;
      this.render();
    },

    toggleShard3D() {
      this.shard3DEnabled = !this.shard3DEnabled;
      this.render();
    },

    saveNotebookEntry(lesson, grammarId) {
      const jp = (this.notebookDraftJp || "").trim();
      if (!jp) {
        this.showToast("Hãy nhập câu tiếng Nhật trước khi lưu vào sổ tay.");
        return;
      }
      this.state.notebookEntries.unshift({
        id: `nb_${Date.now()}`,
        lesson,
        japanese: jp,
        vietnamese: (this.notebookDraftVi || "Câu tự đặt theo mẫu bài học").trim(),
        linkedIds: [grammarId],
        createdAt: new Date().toISOString()
      });
      this.notebookDraftJp = "";
      this.notebookDraftVi = "";
      global.KotoSRS.saveState(this.state);
      this.showToast("Đã lưu câu vào sổ tay わたしの日本語!");
      this.render();
    },

    // --- Memory Weave & Library Handlers ---
    checkReviewCardAnswer() {
      const deck = this.getDueReviewItems().deck;
      const card = deck[this.activeReviewCardIndex % deck.length];
      this.reviewTypedResult = global.KotoSRS.evaluateJapaneseProduction(this.reviewTypedInput, card.accepted);
      this.reviewRevealed = true;
      this.render();
    },

    rateReviewCard(grade) {
      const deck = this.getDueReviewItems().deck;
      const card = deck[this.activeReviewCardIndex % deck.length];
      global.KotoSRS.scheduleSRSReview(this.state, card.itemId, card.skill, grade, {
        prompt: card.promptJp,
        expected: card.expected,
        userResponse: this.reviewTypedInput
      });
      this.activeReviewCardIndex = (this.activeReviewCardIndex + 1) % deck.length;
      this.reviewRevealed = false;
      this.reviewTypedInput = "";
      this.reviewTypedResult = null;
      this.render();
    },

    openLibraryQuiz(id, titleJp, reading, meaningVi) {
      this.librarySelectedItem = { id, titleJp, reading, meaningVi };
      this.libraryQuizInput = "";
      this.libraryQuizFeedback = null;
      this.render();
    },

    verifyLibraryItemQuiz() {
      if (!this.librarySelectedItem) return;
      const it = this.librarySelectedItem;
      const res = global.KotoSRS.evaluateJapaneseProduction(this.libraryQuizInput, [it.reading, it.titleJp]);
      this.libraryQuizFeedback = res.feedbackVi;
      global.KotoSRS.scheduleSRSReview(this.state, it.id, "recognition", res.isCorrect ? 3 : 1, {
        prompt: it.titleJp,
        expected: it.reading,
        userResponse: this.libraryQuizInput
      });
      this.render();
    },

    exportUserProgressJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "koto_living_japanese_progress.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
      this.showToast("Đã xuất tệp JSON tiến độ học tập cá nhân!");
    },

    clearHandwritingTracesPrivacy() {
      this.userStrokes109 = [];
      this.state.handwritingHistory = {};
      global.KotoSRS.saveState(this.state);
      this.showToast("Đã xóa toàn bộ dữ liệu nét vẽ tay cá nhân trên thiết bị.");
      this.render();
    }
  };

  global.KotoApp = App;
})(typeof window !== "undefined" ? window : globalThis);

  </script>

      KotoApp.init(window.KOTO_BUNDLE_DATA);

        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    });
  </script>
