<!DOCTYPE html>
<html lang="vi" data-theme="light" data-furigana="on-touch">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F4ED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>KOTO — ことばのアトリエ · Living Japanese Studio (Marugoto A2 L11–18)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
/* ==========================================================================
   KOTO — ことばのアトリエ (Living Japanese Studio)
   Wa-Modern Japanese Editorial Design System (Sumi, Washi, Aizome, Shu, Yozumi)
   Mobile-First (320px–430px portrait primary, responsive desktop/tablet studio)
   ========================================================================== */

:root {
  /* Surface Tokens — Washi Light Mode (Default) */
  --bg-washi: #F7F4ED;
  --bg-paper-elevated: #FDFBF7;
  --bg-paper-subtle: #EFECE4;
  --bg-paper-inset: #E8E3D8;
  --bg-glass-dock: rgba(253, 251, 247, 0.94);

  /* Ink Tokens — Sumi */
  --ink-sumi: #22272B;
  --ink-secondary: #4A5258;
  --ink-muted: #6A7278;

  /* Structural & Semantic Accents */
  --accent-aizome: #36556C;
  --accent-aizome-soft: #E5EEF5;
  --accent-aizome-border: #B3C9DA;
  --accent-shu: #AC493D;
  --accent-shu-soft: #F9EBE8;
  --accent-sakin: #A28A62;
  --accent-sakin-soft: #F4EFE4;
  --ink-bamboo: #35694C;
  --ink-bamboo-soft: #E6F2EB;

  /* Borders & Rules */
  --border-hairline: #DCD5C7;
  --border-strong: #BFB6A4;
  --shadow-paper: 0 2px 10px rgba(34, 39, 43, 0.05);
  --shadow-modal: 0 12px 32px rgba(34, 39, 43, 0.14);

  /* Typography Stacks */
  --font-mincho: "Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif", Georgia, serif;
  --font-gothic: "Inter", "Noto Sans CJK JP", "Hiragino Sans", "Noto Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "Noto Sans Mono CJK JP", "DejaVu Sans Mono", monospace;

  /* Rhythm & Touch Geometry */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --touch-min: 44px;
  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur-med: 240ms;
}

[data-theme="dark"] {
  /* Yozumi / 夜墨 — Night Ink Dark Mode (WCAG AA/AAA Verified) */
  --bg-washi: #14181D;
  --bg-paper-elevated: #1C2229;
  --bg-paper-subtle: #242C35;
  --bg-paper-inset: #101418;
  --bg-glass-dock: rgba(28, 34, 41, 0.95);

  --ink-sumi: #F0ECE1;
  --ink-secondary: #C0BCB2;
  --ink-muted: #8E969E;

  --accent-aizome: #76A5C8;
  --accent-aizome-soft: #213343;
  --accent-aizome-border: #3B5A75;
  --accent-shu: #E27D6F;
  --accent-shu-soft: #3A2220;
  --accent-sakin: #CBB389;
  --accent-sakin-soft: #2E2920;
  --ink-bamboo: #6FC091;
  --ink-bamboo-soft: #1E3529;

  --border-hairline: #2E3742;
  --border-strong: #455261;
  --shadow-paper: 0 2px 12px rgba(0, 0, 0, 0.35);
  --shadow-modal: 0 14px 36px rgba(0, 0, 0, 0.6);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-med: 0ms;
  }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-washi);
  color: var(--ink-sumi);
  font-family: var(--font-gothic);
  font-size: 16px;
  line-height: 1.55;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Subtle procedural Washi horizontal fiber line (zero GPU blur cost) */
body {
  background-image: radial-gradient(var(--border-hairline) 0.55px, transparent 0.55px);
  background-size: 18px 18px;
}

/* App Shell Container — Mobile-First Column with Desktop Editorial Frame */
.koto-shell {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  background-color: var(--bg-washi);
  border-left: 1px solid var(--border-hairline);
  border-right: 1px solid var(--border-hairline);
}

/* Top Editorial Header */
.koto-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background-color: var(--bg-glass-dock);
  border-bottom: 1px solid var(--border-hairline);
  padding: 8px 14px;
}

.koto-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.koto-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink-sumi);
  cursor: pointer;
}

.koto-seal {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
}

.koto-brand-text {
  display: flex;
  flex-direction: column;
}

.koto-brand-title {
  font-family: var(--font-mincho);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  line-height: 1.15;
}

.koto-brand-sub {
  font-size: 0.7rem;
  color: var(--ink-muted);
  letter-spacing: 0.03em;
}

.koto-header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Minimum 44x44px ergonomic touch buttons */
.btn-icon, .btn-pill, .btn-action {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 6px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hairline);
  background: var(--bg-paper-elevated);
  color: var(--ink-sumi);
  font-family: var(--font-gothic);
  font-size: 0.82rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-editorial),
              border-color var(--dur-fast) var(--ease-editorial),
              transform var(--dur-fast) var(--ease-editorial);
}

.btn-icon:hover, .btn-pill:hover, .btn-action:hover {
  border-color: var(--accent-aizome);
}

.btn-icon:active, .btn-pill:active, .btn-action:active {
  transform: translateY(1px);
}

.btn-primary {
  background: var(--accent-aizome);
  color: #FFFFFF;
  border-color: var(--accent-aizome);
}

[data-theme="dark"] .btn-primary {
  background: var(--accent-aizome);
  color: #101418;
}

.btn-shu {
  background: var(--accent-shu);
  color: #FFFFFF;
  border-color: var(--accent-shu);
}

.btn-active {
  background: var(--accent-aizome-soft);
  border-color: var(--accent-aizome);
  color: var(--accent-aizome);
  font-weight: 600;
}

/* Lesson Switcher Bar (Lessons 11–18) */
.lesson-ribbon {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0 2px 0;
  scrollbar-width: none;
}
.lesson-ribbon::-webkit-scrollbar {
  display: none;
}

.lesson-chip {
  min-height: 38px;
  min-width: 44px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hairline);
  background: var(--bg-paper-elevated);
  color: var(--ink-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.lesson-chip.active {
  background: var(--ink-sumi);
  color: var(--bg-paper-elevated);
  border-color: var(--ink-sumi);
  font-weight: 600;
}

/* Main Content Stage */
.koto-stage {
  padding: 16px 14px 28px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Editorial Cards & Paper Sheets */
.paper-sheet {
  background: var(--bg-paper-elevated);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-md);
  padding: 18px 16px;
  box-shadow: var(--shadow-paper);
  position: relative;
}

.paper-sheet-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--border-hairline);
  padding-bottom: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.sheet-kicker {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-aizome);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.badge-layer {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--accent-sakin);
  background: var(--accent-sakin-soft);
  color: var(--ink-sumi);
}

/* Japanese Ruby / Furigana Discipline */
ruby {
  ruby-align: center;
  ruby-position: over;
}

rt {
  font-family: var(--font-gothic);
  font-size: 0.66rem;
  font-weight: 500;
  color: var(--accent-aizome);
  line-height: 1.1;
  letter-spacing: 0.01em;
  user-select: none;
  transition: opacity var(--dur-fast) var(--ease-editorial);
}

/* Furigana Modes */
[data-furigana="hide"] rt {
  opacity: 0;
}
[data-furigana="on-touch"] rt {
  opacity: 0;
}
[data-furigana="on-touch"] .token-chip:hover rt,
[data-furigana="on-touch"] .token-chip:focus rt,
[data-furigana="on-touch"] .token-chip.active rt,
[data-furigana="on-touch"] .ruby-revealed rt {
  opacity: 1;
}
[data-furigana="always"] rt {
  opacity: 1;
}

/* LIVING SENTENCE WORKBENCH (文のアトリエ) */
.living-sentence-display {
  font-family: var(--font-mincho);
  font-size: clamp(1.35rem, 5vw, 1.8rem);
  line-height: 2.25;
  padding: 14px 8px;
  margin: 4px 0 12px 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 6px 4px;
  border-left: 3px solid var(--accent-aizome);
  background: var(--bg-washi);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.token-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 7px 6px 7px;
  min-height: 44px;
  justify-content: flex-end;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  border-bottom: 2px solid var(--border-strong);
  background: transparent;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-editorial);
}

.token-chip:hover, .token-chip:focus {
  background: var(--accent-aizome-soft);
  border-color: var(--accent-aizome-border);
}

.token-chip.active {
  background: var(--accent-aizome-soft);
  border-color: var(--accent-aizome);
  border-bottom-width: 3px;
  border-bottom-color: var(--accent-shu);
}

.token-surface {
  font-family: var(--font-mincho);
  font-size: clamp(1.3rem, 4.8vw, 1.72rem);
  color: var(--ink-sumi);
  line-height: 1.3;
}

.token-xray-badge {
  font-family: var(--font-gothic);
  font-size: 0.64rem;
  font-weight: 600;
  color: var(--accent-shu);
  background: var(--accent-shu-soft);
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 4px;
  white-space: nowrap;
}

/* 6-Dimension Tab Strip */
.dim-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 12px 0;
}

@media (min-width: 480px) {
  .dim-strip {
    grid-template-columns: repeat(6, 1fr);
  }
}

.dim-tab {
  min-height: 44px;
  padding: 6px 4px;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  background: var(--bg-paper-subtle);
  color: var(--ink-secondary);
  font-size: 0.75rem;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
}

.dim-tab.active {
  background: var(--accent-aizome);
  color: #FFFFFF;
  border-color: var(--accent-aizome);
}

[data-theme="dark"] .dim-tab.active {
  color: #101418;
}

.dim-tab-jp {
  font-family: var(--font-mincho);
  font-size: 0.68rem;
  opacity: 0.88;
}

/* KANJI INK STUDIO (漢字の書房) — Genkō-Yōshi Writing Room */
.ink-studio-layout {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ink-studio-layout.left-handed .ink-controls-row {
  flex-direction: row-reverse;
}

.genko-frame-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: var(--bg-washi);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
}

.genko-canvas-box {
  position: relative;
  width: min(100%, 300px);
  aspect-ratio: 1 / 1;
  background: var(--bg-paper-elevated);
  border: 2px solid var(--accent-aizome);
  border-radius: var(--radius-sm);
  overflow: hidden;
  /* Strict touch-action isolation ONLY inside the writing square */
  touch-action: none;
  user-select: none;
}

.genko-grid-svg,
.genko-guide-svg,
.genko-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.genko-grid-svg,
.genko-guide-svg {
  pointer-events: none;
}

.genko-canvas {
  cursor: crosshair;
  touch-action: none;
}

/* Five-Layer Progression Pill Strip */
.layer-progression {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

.layer-step-btn {
  min-height: 44px;
  padding: 4px 2px;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  background: var(--bg-paper-subtle);
  color: var(--ink-secondary);
  font-size: 0.7rem;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}

.layer-step-btn.active {
  background: var(--accent-shu);
  color: #FFFFFF;
  border-color: var(--accent-shu);
}

/* KAIWA THEATER (会話の舞台) — Japanese Screenplay Layout */
.kaiwa-stage {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.kaiwa-turn {
  display: grid;
  grid-template-columns: 68px 1fr;
  gap: 10px;
  padding: 12px;
  border-bottom: 1px solid var(--border-hairline);
  background: var(--bg-paper-elevated);
  border-radius: var(--radius-sm);
}

.kaiwa-turn.speaker-B {
  border-left: 3px solid var(--accent-aizome);
  background: var(--bg-washi);
}

.kaiwa-speaker-col {
  font-family: var(--font-mincho);
  font-weight: 700;
  font-size: 0.82rem;
  color: var(--accent-aizome);
  border-right: 1px solid var(--border-hairline);
  padding-right: 6px;
}

.kaiwa-turn.speaker-B .kaiwa-speaker-col {
  color: var(--accent-shu);
}

/* Contrast Lens Side-by-Side Box */
.contrast-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

@media (min-width: 480px) {
  .contrast-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.contrast-card {
  padding: 12px;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
  background: var(--bg-washi);
}

/* Bottom Contextual Dock */
.koto-dock {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 680px;
  z-index: 50;
  background: var(--bg-glass-dock);
  border-top: 1px solid var(--border-strong);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)) 8px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

.dock-item {
  min-height: 48px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-family: var(--font-gothic);
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
}

.dock-item.active {
  background: var(--accent-aizome-soft);
  color: var(--accent-aizome);
  border-color: var(--accent-aizome-border);
}

.dock-item-jp {
  font-family: var(--font-mincho);
  font-size: 0.65rem;
  opacity: 0.85;
}

/* Inputs & Tables */
.koto-input {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  font-family: var(--font-gothic);
  font-size: 1rem;
  color: var(--ink-sumi);
  background: var(--bg-paper-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
}

.koto-input:focus {
  outline: 2px solid var(--accent-aizome);
  border-color: var(--accent-aizome);
}

.koto-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-sm);
}

.koto-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.84rem;
}

.koto-table th, .koto-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-hairline);
  text-align: left;
}

.koto-table th {
  background: var(--bg-paper-subtle);
  font-weight: 600;
}


/* Horizontal Scroll Ribbon Polish — prevent vertical squishing of pills on mobile */
.lesson-chip {
  flex-shrink: 0;
  white-space: nowrap;
}
div[style*="overflow-x:auto"] > .btn-pill,
div[style*="overflow-x: auto"] > .btn-pill,
div[style*="overflow-x:auto"] > .lesson-chip {
  flex-shrink: 0;
  white-space: nowrap;
}

  </style>

を 作ってきました。", "english": "I brought sushi that I made."}], "use_japanese": "ピクニックなどで、準備する／したものについて話すときに使う", "use_english": "Used when talking about the preperation you will do/have done for a picnic or other event.", "structure_tables_markdown": ["### Structure (構造図)\n| V-て | いきます |   |\n| --- | --- | --- |\n| V-て | きます |   |\n> *Only studied in Rikai*", "### ＜V てけい＞\n| 1グループ |   |\n| --- | --- |\n| かいます | かって |\n| つくります | つくって |\n| もちます | もって |"], "examples": [{"japanese": "①ピクニックに おにぎりを 持っていきます。", "english": "I will bring rice balls to the picnic."}, {"japanese": "②私は サンドイッチを 作っていきます。", "english": "I will make sandwiches and bring them."}, {"japanese": "③ケーキを 買ってきました。みんなで 食べましょう。", "english": "I bought a cake. Let's eat it together."}], "commentary": [{"japanese": "② は「サンドイッチを作ります。それから、持って行きます」、③は「ケーキを買いました。それから、持って来ました」の意味。", "english": "② means \"I make a sandwich. Then, I will bring the sandwich.\" ③ means \"I bought a cake. Then, I brought the cake.\""}], "raw_markdown": "## Lesson 11.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/11_1/](https://www.marugoto-online.jp/a2/support/lesson/11_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/11_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/11_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** 私は おすしを 作っていきます。\n  **English:** I will make sushi and bring it.\n- **Japanese:** 私は おすしを 作ってきました。\n  **English:** I brought sushi that I made.\n\n### Use (使い方)\n\n- ピクニックなどで、準備する／したものについて話すときに使う\n  *(Used when talking about the preperation you will do/have done for a picnic or other event.)*\n\n### Structure (構造図)\n\n| V-て | いきます |   |\n| --- | --- | --- |\n| V-て | きます |   |\n\n> *Only studied in Rikai*\n\n### ＜V てけい＞\n\n| 1グループ |   |\n| --- | --- |\n| かいます | かって |\n| つくります | つくって |\n| もちます | もって |\n\n### Examples (例文)\n\n1. **①ピクニックに おにぎりを 持っていきます。**\n   - *I will bring rice balls to the picnic.*\n2. **②私は サンドイッチを 作っていきます。**\n   - *I will make sandwiches and bring them.*\n3. **③ケーキを 買ってきました。みんなで 食べましょう。**\n   - *I bought a cake. Let's eat it together.*\n\n### Commentary (解説)\n\n- ② は「サンドイッチを作ります。それから、持って行きます」、③は「ケーキを買いました。それから、持って来ました」の意味。\n  *(② means \"I make a sandwich. Then, I will bring the sandwich.\" ③ means \"I bought a cake. Then, I brought the cake.\")*\n\n---\n\n<a id=\"lesson-11-2\"></a>", "checksum": "4658f2c28f48053b", "layer": "CORE"}, {"occurrence_id": "grammar_L11_2", "section_code": "11.2", "lesson": 11, "subsection": 2, "title": "くだものは 何でも 好きです。", "source_file": "grammar.md", "source_line": 82, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/11_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/11_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "くだものは 何でも 好きです。", "english": "I like any kind of fruit."}], "use_japanese": "数や場所などについて、特に希望がないときに使う", "use_english": "Used when you have no preference for the amount, the location, or other characteristic of something.", "structure_tables_markdown": ["### Structure (構造図)\n| なん | でも |   |\n| --- | --- | --- |\n| いつ | でも |   |\n| どこ | でも |   |\n| いくつ | でも |   |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①A：ピクニックの 日は いつが いいですか。", "english": "A: For the picnic day, when is alright?"}, {"japanese": "B：いつでも いいです。", "english": "B: Any day is ok."}, {"japanese": "②A：おにぎりを いくつ 持っていきますか。", "english": "A: How many rice balls shall I bring?"}, {"japanese": "B：いくつでも いいです。", "english": "B: Any amount is ok."}, {"japanese": "③おさけは 何でも 好きです。", "english": "I like any kind of alcohol."}], "commentary": [{"japanese": "もの、人、時、場所、数などを制限しないことを表す。", "english": "This sentence pattern indicates that there is no limitation for things, people, time, location, numbers and so on."}], "raw_markdown": "## Lesson 11.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/11_2/](https://www.marugoto-online.jp/a2/support/lesson/11_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/11_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/11_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** くだものは 何でも 好きです。\n  **English:** I like any kind of fruit.\n\n### Use (使い方)\n\n- 数や場所などについて、特に希望がないときに使う\n  *(Used when you have no preference for the amount, the location, or other characteristic of something.)*\n\n### Structure (構造図)\n\n| なん | でも |   |\n| --- | --- | --- |\n| いつ | でも |   |\n| どこ | でも |   |\n| いくつ | でも |   |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①A：ピクニックの 日は いつが いいですか。**\n   - *A: For the picnic day, when is alright?*\n2. **B：いつでも いいです。**\n   - *B: Any day is ok.*\n3. **②A：おにぎりを いくつ 持っていきますか。**\n   - *A: How many rice balls shall I bring?*\n4. **B：いくつでも いいです。**\n   - *B: Any amount is ok.*\n5. **③おさけは 何でも 好きです。**\n   - *I like any kind of alcohol.*\n\n### Commentary (解説)\n\n- もの、人、時、場所、数などを制限しないことを表す。\n  *(This sentence pattern indicates that there is no limitation for things, people, time, location, numbers and so on.)*\n\n---\n\n<a id=\"lesson-11-3\"></a>", "checksum": "5b293dd4a0cae244", "layer": "CORE"}, {"occurrence_id": "grammar_L11_3", "section_code": "11.3", "lesson": 11, "subsection": 3, "title": "飲み物は お茶と ジュースと どちらが いいですか。―私は お茶が いいです。", "source_file": "grammar.md", "source_line": 128, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/11_3/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/11_3/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "飲み物は お茶と ジュースと どちらが いいですか。―私は お茶が いいです。", "english": "Which would you like, tea or juice? - I would like tea."}], "use_japanese": "二つの考えのうちの一つに決めたいときに使う", "use_english": "Used when choosing which is preferred from two options.", "structure_tables_markdown": ["### Structure (構造図)\n| N1 | と | N2 | （と）、 | どちら | が | いいですか。 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| N1 | と | N2 | （と）、 | どっち | が | いいですか。 |   |\n|   |   |   |   | N | が | いいです。 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①A：ピクニックは 土よう日と 日よう日と どちらが いいですか。", "english": "A: Which is better for the picnic, Saturday or Sunday?"}, {"japanese": "B：土よう日が いいです。", "english": "B: Saturday is better."}, {"japanese": "②A：ワインは 赤と 白、どっちが いいですか。", "english": "A: Which would you like for wine, white or red?"}, {"japanese": "B：私は どっちでも いいです。", "english": "A: Either one is fine for me."}], "commentary": [{"japanese": "N1とN2の二つを比較するとどうであるかをきく／言うときに使う。", "english": "It is used when asking the outcome after comparing N1 and N2."}, {"japanese": "「N2と」の「と」は省略される場合もある。", "english": "The \"と\" in \"N2と\" is sometimes omitted."}, {"japanese": "会話では「どちら」の代わりに「どっち」も使われる。", "english": "In a conversation, \"どっち\" is used in place of \"どちら\"."}], "raw_markdown": "## Lesson 11.3\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/11_3/](https://www.marugoto-online.jp/a2/support/lesson/11_3/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/11_3/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/11_3/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** 飲み物は お茶と ジュースと どちらが いいですか。―私は お茶が いいです。\n  **English:** Which would you like, tea or juice? - I would like tea.\n\n### Use (使い方)\n\n- 二つの考えのうちの一つに決めたいときに使う\n  *(Used when choosing which is preferred from two options.)*\n\n### Structure (構造図)\n\n| N1 | と | N2 | （と）、 | どちら | が | いいですか。 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| N1 | と | N2 | （と）、 | どっち | が | いいですか。 |   |\n\n|   |   |   |   | N | が | いいです。 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①A：ピクニックは 土よう日と 日よう日と どちらが いいですか。**\n   - *A: Which is better for the picnic, Saturday or Sunday?*\n2. **B：土よう日が いいです。**\n   - *B: Saturday is better.*\n3. **②A：ワインは 赤と 白、どっちが いいですか。**\n   - *A: Which would you like for wine, white or red?*\n4. **B：私は どっちでも いいです。**\n   - *A: Either one is fine for me.*\n\n### Commentary (解説)\n\n- N1とN2の二つを比較するとどうであるかをきく／言うときに使う。\n  *(It is used when asking the outcome after comparing N1 and N2.)*\n- 「N2と」の「と」は省略される場合もある。\n  *(The \"と\" in \"N2と\" is sometimes omitted.)*\n- 会話では「どちら」の代わりに「どっち」も使われる。\n  *(In a conversation, \"どっち\" is used in place of \"どちら\". )*\n\n---\n\n<a id=\"lesson-12-1\"></a>", "checksum": "ffccbe27c5cb08c6", "layer": "CORE"}, {"occurrence_id": "grammar_L12_1", "section_code": "12.1", "lesson": 12, "subsection": 1, "title": "その おすし、おいしそうですね。", "source_file": "grammar.md", "source_line": 177, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/12_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/12_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "その おすし、おいしそうですね。", "english": "That sushi looks delicious, doesn't it?"}, {"japanese": "それ、 べんりそうなナイフですね。", "english": "That looks like a useful knife, doesn't it?"}], "use_japanese": "外から見て、どう思ったかを言うときに使う", "use_english": "Used when saying what you think about something from the outside.", "structure_tables_markdown": ["### Structure (構造図)\n| イA | そうです |   |\n| --- | --- | --- |\n| ナA | そうです |   |\n| イA | そうな | N |   |\n| --- | --- | --- | --- |\n| ナA | そうな | N |   |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①子どもたちが あそんでいます。楽しそうです。", "english": "The children are playing. They look fun."}, {"japanese": "②あの 人は ひまそうです。", "english": "That person looks bored."}, {"japanese": "③あの ねこ、きもちが よさそうですね。", "english": "That cat looks like it feels good."}, {"japanese": "④わぁ、あまそうな いちごですね。一つ、いただきます。", "english": "Wow, that looks like a very sweet strawberry. I will have one."}], "commentary": [{"japanese": "イAは「あついです → あつ」のように、「イA-いです」から「いです」をとった形。ナAは「べんりです → べんり」のように、「ナAです」から「です」をとった形。", "english": "イA can be made by taking out 「いです」 from 「イA-いです」 as in 「あついです → あつ」. ナA can be made by taking out 「です」 from 「ナAです」, as in 「べんりです → べんり」."}, {"japanese": "「いいです」は「よさそうです」になる。（③）", "english": "Take note that the adjective 「いいです」 becomes 「よさそうです」.（③）"}, {"japanese": "「そうです」文が名詞を修飾するときは、「そうなＮ」となる。（④）", "english": "When nouns are modified, 「そうです」 becomes 「そうなＮ」.（④）"}], "raw_markdown": "## Lesson 12.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/12_1/](https://www.marugoto-online.jp/a2/support/lesson/12_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/12_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/12_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** その おすし、おいしそうですね。\n  **English:** That sushi looks delicious, doesn't it?\n- **Japanese:** それ、 べんりそうなナイフですね。\n  **English:** That looks like a useful knife, doesn't it?\n\n### Use (使い方)\n\n- 外から見て、どう思ったかを言うときに使う\n  *(Used when saying what you think about something from the outside.)*\n\n### Structure (構造図)\n\n| イA | そうです |   |\n| --- | --- | --- |\n| ナA | そうです |   |\n\n| イA | そうな | N |   |\n| --- | --- | --- | --- |\n| ナA | そうな | N |   |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①子どもたちが あそんでいます。楽しそうです。**\n   - *The children are playing. They look fun.*\n2. **②あの 人は ひまそうです。**\n   - *That person looks bored.*\n3. **③あの ねこ、きもちが よさそうですね。**\n   - *That cat looks like it feels good.*\n4. **④わぁ、あまそうな いちごですね。一つ、いただきます。**\n   - *Wow, that looks like a very sweet strawberry. I will have one.*\n\n### Commentary (解説)\n\n- イAは「あついです → あつ」のように、「イA-いです」から「いです」をとった形。ナAは「べんりです → べんり」のように、「ナAです」から「です」をとった形。\n  *(イA can be made by taking out 「いです」 from 「イA-いです」 as in 「あついです → あつ」. ナA can be made by taking out 「です」 from 「ナAです」, as in 「べんりです → べんり」.)*\n- 「いいです」は「よさそうです」になる。（③）\n  *(Take note that the adjective 「いいです」 becomes 「よさそうです」.（③）)*\n- 「そうです」文が名詞を修飾するときは、「そうなＮ」となる。（④）\n  *(When nouns are modified, 「そうです」 becomes 「そうなＮ」.（④）)*\n\n---\n\n<a id=\"lesson-12-2\"></a>", "checksum": "8205026d0d3b2102", "layer": "CORE"}, {"occurrence_id": "grammar_L12_2", "section_code": "12.2", "lesson": 12, "subsection": 2, "title": "あたたかくて、おいしいです。／からくなくて、おいしいです。", "source_file": "grammar.md", "source_line": 229, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/12_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/12_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "あたたかくて、おいしいです。／からくなくて、おいしいです。", "english": "It's warm, so it's delicious. / It's not spicy, so it's delicious."}, {"japanese": "しんせんで、おいしいです。／にがてじゃなくて、よかったです。", "english": "It's fresh, so it's delicious. / They like it, so it was good."}], "use_japanese": "理由や原因を言うときに使う", "use_english": "Used when talking about the reason or cause.", "structure_tables_markdown": ["### Structure (構造図)\n| イA-くて、 | S |   |\n| --- | --- | --- |\n| イA-くなくて、 | S |   |\n| ナA-で、 | S |   |\n| ナA-じゃなくて、 | S |   |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①この ジュースは つめたくて、おいしいです。", "english": "This juice is cold, so it's delicious."}, {"japanese": "②この ジュースは つめたくなくて、おいしくないです。", "english": "This juice is not cold, so it's not delicious."}, {"japanese": "③この こうえんは しずかで、きもちが いいです。", "english": "This park is quiet, so it feels good."}, {"japanese": "④友だちが あまいものが にがてじゃなくて、よかったです。", "english": "My friend likes sweets, so it was good."}], "commentary": [{"japanese": "「イA1-くて／イA-くなくて／ナA1-で／ナA-じゃなくて」が、後に続くSで表されることの原因または理由を表す。", "english": "「イA1-くて／イA-くなくて／ナA1-で／ナA-じゃなくて」 indicates the cause or the reason followed by S."}], "raw_markdown": "## Lesson 12.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/12_2/](https://www.marugoto-online.jp/a2/support/lesson/12_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/12_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/12_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** あたたかくて、おいしいです。／からくなくて、おいしいです。\n  **English:** It's warm, so it's delicious. / It's not spicy, so it's delicious. \n- **Japanese:** しんせんで、おいしいです。／にがてじゃなくて、よかったです。\n  **English:** It's fresh, so it's delicious. / They like it, so it was good.\n\n### Use (使い方)\n\n- 理由や原因を言うときに使う\n  *(Used when talking about the reason or cause.)*\n\n### Structure (構造図)\n\n| イA-くて、 | S |   |\n| --- | --- | --- |\n| イA-くなくて、 | S |   |\n| ナA-で、 | S |   |\n| ナA-じゃなくて、 | S |   |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①この ジュースは つめたくて、おいしいです。**\n   - *This juice is cold, so it's delicious.*\n2. **②この ジュースは つめたくなくて、おいしくないです。**\n   - *This juice is not cold, so it's not delicious.*\n3. **③この こうえんは しずかで、きもちが いいです。**\n   - *This park is quiet, so it feels good.*\n4. **④友だちが あまいものが にがてじゃなくて、よかったです。**\n   - *My friend likes sweets, so it was good.*\n\n### Commentary (解説)\n\n- 「イA1-くて／イA-くなくて／ナA1-で／ナA-じゃなくて」が、後に続くSで表されることの原因または理由を表す。\n  *(「イA1-くて／イA-くなくて／ナA1-で／ナA-じゃなくて」 indicates the cause or the reason followed by S.)*\n\n---\n\n<a id=\"lesson-13-1\"></a>", "checksum": "4028d99c6a25782a", "layer": "CORE"}, {"occurrence_id": "grammar_L13_1", "section_code": "13.1", "lesson": 13, "subsection": 1, "title": "外国に 行ったことが あります。", "source_file": "grammar.md", "source_line": 275, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/13_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/13_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "外国に 行ったことが あります。", "english": "I have been overseas."}], "use_japanese": "経験を言うときに使う", "use_english": "Used when talking about your experience.", "structure_tables_markdown": ["### Structure (構造図)\n| V-た | ことが あります |\n| --- | --- |", "### ＜Vたけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| いきます おくります はたらきます もらいます | いった おくった はたらいた もらった | みます | みた | します | した |"], "examples": [{"japanese": "①日本に 行ったことが あります。", "english": "I have been to Japan."}, {"japanese": "②外国に にもつを おくったことが ありません。", "english": "I haven't sent anything overseas before."}, {"japanese": "③A：今までに つうやくを したことが ありますか。", "english": "A: Have you ever interpreted until now?"}, {"japanese": "B：はい、あります。", "english": "B: Yes, I have."}], "commentary": [{"japanese": "「V-たこと」が何であるかわかっている場合は、「V-たことが」を省略することがある。（③）", "english": "In cases when it is understood what 「V-たこと」 is, 「V-たことが」 is sometimes omitted.（③）"}], "raw_markdown": "## Lesson 13.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/13_1/](https://www.marugoto-online.jp/a2/support/lesson/13_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/13_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/13_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** 外国に 行ったことが あります。\n  **English:** I have been overseas.\n\n### Use (使い方)\n\n- 経験を言うときに使う\n  *(Used when talking about your experience.)*\n\n### Structure (構造図)\n\n| V-た | ことが あります |\n| --- | --- |\n\n### ＜Vたけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| いきます おくります はたらきます もらいます | いった おくった はたらいた もらった | みます | みた | します | した |\n\n### Examples (例文)\n\n1. **①日本に 行ったことが あります。**\n   - *I have been to Japan.*\n2. **②外国に にもつを おくったことが ありません。**\n   - *I haven't sent anything overseas before.*\n3. **③A：今までに つうやくを したことが ありますか。**\n   - *A: Have you ever interpreted until now?*\n4. **B：はい、あります。**\n   - *B: Yes, I have.*\n\n### Commentary (解説)\n\n- 「V-たこと」が何であるかわかっている場合は、「V-たことが」を省略することがある。（③）\n  *(In cases when it is understood what 「V-たこと」 is, 「V-たことが」 is sometimes omitted.（③）)*\n\n---\n\n<a id=\"lesson-13-2\"></a>", "checksum": "c511093de88a247a", "layer": "CORE"}, {"occurrence_id": "grammar_L13_2", "section_code": "13.2", "lesson": 13, "subsection": 2, "title": "この へやは さむすぎます。", "source_file": "grammar.md", "source_line": 320, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/13_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/13_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "この へやは さむすぎます。", "english": "This room is too cold."}, {"japanese": "この へやは しずかすぎます。", "english": "This room is too quiet."}, {"japanese": "きのうの 夜 飲みすぎました。", "english": "I drank too much last night."}], "use_japanese": "普通の程度をこえていて、あまりよくないときに使う。", "use_english": "Used when talking about too much of something, in a negative context.", "structure_tables_markdown": ["### Structure (構造図)\n| イA | すぎます |   |\n| --- | --- | --- |\n| ナA | すぎます |   |\n| V | すぎます |   |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①このホテルは 高すぎます。", "english": "This hotel is too expensive."}, {"japanese": "②ここは しずかすぎます。ちょっと こわいです。", "english": "It is too quiet here. It's a little scary."}, {"japanese": "③おなかが いっぱいです。食べすぎました。", "english": "I am full. I ate too much."}], "commentary": [{"japanese": "イAは「あついです →あつ」のように、「イA-いです」から「いです」をとった形。ナAは「べんりです →べんり」のように、「ナAです」から「です」をとった形。Vは、「行きます → 行き」のように「Vます」から「ます」をとった形。", "english": "イA can be made by taking out 「いです」 from 「イA-いです」 as in 「あついです → あつ」. ナA can be made by taking out 「です」 from 「ナAです」, as in 「べんりです → べんり」.V can be made by taking out 「ます」 from 「Vます」 as in 「行きます → 行き」."}], "raw_markdown": "## Lesson 13.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/13_2/](https://www.marugoto-online.jp/a2/support/lesson/13_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/13_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/13_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** この へやは さむすぎます。\n  **English:** This room is too cold.\n- **Japanese:** この へやは しずかすぎます。\n  **English:** This room is too quiet.\n- **Japanese:** きのうの 夜 飲みすぎました。\n  **English:** I drank too much last night.\n\n### Use (使い方)\n\n- 普通の程度をこえていて、あまりよくないときに使う。\n  *(Used when talking about too much of something, in a negative context.)*\n\n### Structure (構造図)\n\n| イA | すぎます |   |\n| --- | --- | --- |\n| ナA | すぎます |   |\n| V | すぎます |   |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①このホテルは 高すぎます。**\n   - *This hotel is too expensive.*\n2. **②ここは しずかすぎます。ちょっと こわいです。**\n   - *It is too quiet here. It's a little scary.*\n3. **③おなかが いっぱいです。食べすぎました。**\n   - *I am full. I ate too much.*\n\n### Commentary (解説)\n\n- イAは「あついです →あつ」のように、「イA-いです」から「いです」をとった形。ナAは「べんりです →べんり」のように、「ナAです」から「です」をとった形。Vは、「行きます → 行き」のように「Vます」から「ます」をとった形。\n  *(イA can be made by taking out 「いです」 from 「イA-いです」 as in 「あついです → あつ」. ナA can be made by taking out 「です」 from 「ナAです」, as in 「べんりです → べんり」.V can be made by taking out 「ます」 from 「Vます」 as in 「行きます → 行き」.)*\n\n---\n\n<a id=\"lesson-13-3\"></a>", "checksum": "c1ff262add902244", "layer": "CORE"}, {"occurrence_id": "grammar_L13_3", "section_code": "13.3", "lesson": 13, "subsection": 3, "title": "この ホテルは 古いですが、きれいです。", "source_file": "grammar.md", "source_line": 365, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/13_3/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/13_3/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "この ホテルは 古いですが、きれいです。", "english": "This hotel is old, but it's pretty."}], "use_japanese": "いいことと悪いことの両方を言うときに使う", "use_english": "Used when describing the good and bad points of something.", "structure_tables_markdown": ["### Structure (構造図)\n| N1は／が N2ですイA1‐いですナA1‐ですV1ます S1 | N1は／が | N2ですイA1‐いですナA1‐ですV1ます | S1 | が、 | N3は／が N4ですイA2‐いですナA2‐ですV2ます S2 | N3は／が | N4ですイA2‐いですナA2‐ですV2ます | S2 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| N1は／が | N2ですイA1‐いですナA1‐ですV1ます |   |   |   |   |   |   |   |   |\n| S1 |   |   |   |   |   |   |   |   |   |\n| N3は／が | N4ですイA2‐いですナA2‐ですV2ます |   |   |   |   |   |   |   |   |\n| S2 |   |   |   |   |   |   |   |   |   |\n| N1は／が | N2ですイA1‐いですナA1‐ですV1ます |\n| --- | --- |\n| S1 |   |\n| N3は／が | N4ですイA2‐いですナA2‐ですV2ます |\n| --- | --- |\n| S2 |   |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①このホテルは きれいですが、ねだんが 高いです。", "english": "This hotel is beautiful, but it's expensive."}, {"japanese": "②エアコンは ありますが、こわれています。", "english": "There is an air conditioner, but it's broken."}, {"japanese": "③ここは 新しい 町ですが、ちょっと ふべんです。", "english": "This is a new town, but it's a little inconvenient."}], "commentary": [{"japanese": "「が」は、S1とS2をつなぐ。", "english": "「が」 connects S1 and S2."}, {"japanese": "S1がプラス評価の文のときは、S2はマイナス評価の文、S1がマイナス評価の文のときは、S2はプラス評価の文になる。", "english": "When S1 is a sentence with a positive connotation, S2 becomes a sentence with a negative connotation. When S1 is a sentence with a negative connotation, S2 becomes a sentence with a positive connotation."}], "raw_markdown": "## Lesson 13.3\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/13_3/](https://www.marugoto-online.jp/a2/support/lesson/13_3/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/13_3/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/13_3/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** この ホテルは 古いですが、きれいです。\n  **English:** This hotel is old, but it's pretty.\n\n### Use (使い方)\n\n- いいことと悪いことの両方を言うときに使う\n  *(Used when describing the good and bad points of something.)*\n\n### Structure (構造図)\n\n| N1は／が N2ですイA1‐いですナA1‐ですV1ます S1 | N1は／が | N2ですイA1‐いですナA1‐ですV1ます | S1 | が、 | N3は／が N4ですイA2‐いですナA2‐ですV2ます S2 | N3は／が | N4ですイA2‐いですナA2‐ですV2ます | S2 |   |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| N1は／が | N2ですイA1‐いですナA1‐ですV1ます |   |   |   |   |   |   |   |   |\n| S1 |   |   |   |   |   |   |   |   |   |\n| N3は／が | N4ですイA2‐いですナA2‐ですV2ます |   |   |   |   |   |   |   |   |\n| S2 |   |   |   |   |   |   |   |   |   |\n\n| N1は／が | N2ですイA1‐いですナA1‐ですV1ます |\n| --- | --- |\n| S1 |   |\n\n| N3は／が | N4ですイA2‐いですナA2‐ですV2ます |\n| --- | --- |\n| S2 |   |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①このホテルは きれいですが、ねだんが 高いです。**\n   - *This hotel is beautiful, but it's expensive.*\n2. **②エアコンは ありますが、こわれています。**\n   - *There is an air conditioner, but it's broken.*\n3. **③ここは 新しい 町ですが、ちょっと ふべんです。**\n   - *This is a new town, but it's a little inconvenient.*\n\n### Commentary (解説)\n\n- 「が」は、S1とS2をつなぐ。\n  *(「が」 connects S1 and S2.)*\n- S1がプラス評価の文のときは、S2はマイナス評価の文、S1がマイナス評価の文のときは、S2はプラス評価の文になる。\n  *(When S1 is a sentence with a positive connotation, S2 becomes a sentence with a negative connotation. When S1 is a sentence with a negative connotation, S2 becomes a sentence with a positive connotation.)*\n\n---\n\n<a id=\"lesson-14-1\"></a>", "checksum": "ae2952b5fc5d8807", "layer": "CORE"}, {"occurrence_id": "grammar_L14_1", "section_code": "14.1", "lesson": 14, "subsection": 1, "title": "この 会社に 入って １０ 年に なります。", "source_file": "grammar.md", "source_line": 418, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/14_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/14_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "この 会社に 入って １０ 年に なります。", "english": "It's been 10 years since I entered this company."}], "use_japanese": "何かを始めてからどれぐらい時間がたったかを言うときに使う", "use_english": "Used when talking about how much time has passed since starting something.", "structure_tables_markdown": ["### Structure (構造図)\n| V-て | ～年 ～か月 | に | なります |   |\n| --- | --- | --- | --- | --- |\n> *Only studied in Rikai*", "### ＜Vてけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| すみます はいります | すんで はいって | はじめます | はじめて | きます | きて |"], "examples": [{"japanese": "①日本語の 勉強を はじめて １年に なります。", "english": "It's been one year since I started studying Japanese."}, {"japanese": "②日本に 来て ３か月に なります。", "english": "It's been three months since I came to Japan."}], "commentary": [], "raw_markdown": "## Lesson 14.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/14_1/](https://www.marugoto-online.jp/a2/support/lesson/14_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/14_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/14_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** この 会社に 入って １０ 年に なります。\n  **English:** It's been 10 years since I entered this company.\n\n### Use (使い方)\n\n- 何かを始めてからどれぐらい時間がたったかを言うときに使う\n  *(Used when talking about how much time has passed since starting something.)*\n\n### Structure (構造図)\n\n| V-て | ～年 ～か月 | に | なります |   |\n| --- | --- | --- | --- | --- |\n\n> *Only studied in Rikai*\n\n### ＜Vてけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| すみます はいります | すんで はいって | はじめます | はじめて | きます | きて |\n\n### Examples (例文)\n\n1. **①日本語の 勉強を はじめて １年に なります。**\n   - *It's been one year since I started studying Japanese.*\n2. **②日本に 来て ３か月に なります。**\n   - *It's been three months since I came to Japan.*\n\n---\n\n<a id=\"lesson-14-2\"></a>", "checksum": "163725e28a6feb14", "layer": "CORE"}, {"occurrence_id": "grammar_L14_2", "section_code": "14.2", "lesson": 14, "subsection": 2, "title": "ペンを 借りても いいですか。", "source_file": "grammar.md", "source_line": 456, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/14_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/14_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "ペンを 借りても いいですか。", "english": "May I borrow a pen?"}], "use_japanese": "許可を求めるときに使う", "use_english": "Used when asking for permission.", "structure_tables_markdown": ["### Structure (構造図)\n| V-て | も | いいですか |\n| --- | --- | --- |", "### ＜Vてけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| かきます けします すわります つかいます はいります もらいます | かいて けして すわって つかって はいって もらって | かります みます あけます しめます つけます はじめます | かりて みて あけて しめて つけて はじめて | します | して |"], "examples": [{"japanese": "①A：すみません。入っても いいですか。", "english": "A: Excuse me. May I come in?"}, {"japanese": "B：はい、どうぞ。", "english": "B: Yes. Come in."}, {"japanese": "②A：これ、日本語で 書いても いいですか。", "english": "A: May I write this in Japanese?"}, {"japanese": "B：すみません、英語で おねがいします。", "english": "B: I'm sorry, but English please."}], "commentary": [{"japanese": "許可を求められて、許可を与えるときの答え方の例：「はい。」「はい、いいです。」「はい、どうぞ。」「はい、お願いします。」", "english": "When you allow something to be done after being asked, the replies are as follows."}, {"japanese": "許可を求められて、許可を与えないときの答え方の例：「いいえ。」「いいえ、ちょっと・・・。」「すみません。」", "english": "When you don't allow something to be done, the replies are as follows."}], "raw_markdown": "## Lesson 14.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/14_2/](https://www.marugoto-online.jp/a2/support/lesson/14_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/14_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/14_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** ペンを 借りても いいですか。\n  **English:** May I borrow a pen?\n\n### Use (使い方)\n\n- 許可を求めるときに使う\n  *(Used when asking for permission.)*\n\n### Structure (構造図)\n\n| V-て | も | いいですか |\n| --- | --- | --- |\n\n### ＜Vてけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| かきます けします すわります つかいます はいります もらいます | かいて けして すわって つかって はいって もらって | かります みます あけます しめます つけます はじめます | かりて みて あけて しめて つけて はじめて | します | して |\n\n### Examples (例文)\n\n1. **①A：すみません。入っても いいですか。**\n   - *A: Excuse me. May I come in?*\n2. **B：はい、どうぞ。**\n   - *B: Yes. Come in.*\n3. **②A：これ、日本語で 書いても いいですか。**\n   - *A: May I write this in Japanese?*\n4. **B：すみません、英語で おねがいします。**\n   - *B: I'm sorry, but English please.*\n\n### Commentary (解説)\n\n- 許可を求められて、許可を与えるときの答え方の例：「はい。」「はい、いいです。」「はい、どうぞ。」「はい、お願いします。」\n  *(When you allow something to be done after being asked, the replies are as follows.)*\n- 許可を求められて、許可を与えないときの答え方の例：「いいえ。」「いいえ、ちょっと・・・。」「すみません。」\n  *(When you don't allow something to be done, the replies are as follows.)*\n\n---\n\n<a id=\"lesson-15-1\"></a>", "checksum": "dd7e4b1e47100502", "layer": "CORE"}, {"occurrence_id": "grammar_L15_1", "section_code": "15.1", "lesson": 15, "subsection": 1, "title": "ねる 前に、おふろに 入ります。", "source_file": "grammar.md", "source_line": 503, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/15_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/15_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "ねる 前に、おふろに 入ります。", "english": "Before going to bed, I take a bath."}], "use_japanese": "あることをする前に何をするか言うときに使う", "use_english": "Used when talking about doing something  before something else.", "structure_tables_markdown": ["### Structure (構造図)\n| V1-る | まえに | V2ます |\n| --- | --- | --- |", "### ＜Vるけい／じしょけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| およぎます ききます のみます はいります はしります まわします | およぐ きく のむ はいる はしる まわす | おきます たべます ねます | おきる たべる ねる | します | する |"], "examples": [{"japanese": "①はしる 前に、たいそうを します。", "english": "Before running, I do some stretching exercise."}, {"japanese": "②学校へ 行く 前に、ごはんを 食べます。", "english": "Before going to school, I have something to eat."}], "commentary": [{"japanese": "「まえに」は、V1で表される行動よりV2で表される行動の方が先に行われることを示す。", "english": "「まえに」 indicates that the action V2 occurs before the action V1."}], "raw_markdown": "## Lesson 15.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/15_1/](https://www.marugoto-online.jp/a2/support/lesson/15_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/15_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/15_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** ねる 前に、おふろに 入ります。\n  **English:** Before going to bed, I take a bath.\n\n### Use (使い方)\n\n- あることをする前に何をするか言うときに使う\n  *(Used when talking about doing something  before something else.)*\n\n### Structure (構造図)\n\n| V1-る | まえに | V2ます |\n| --- | --- | --- |\n\n### ＜Vるけい／じしょけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| およぎます ききます のみます はいります はしります まわします | およぐ きく のむ はいる はしる まわす | おきます たべます ねます | おきる たべる ねる | します | する |\n\n### Examples (例文)\n\n1. **①はしる 前に、たいそうを します。**\n   - *Before running, I do some stretching exercise.*\n2. **②学校へ 行く 前に、ごはんを 食べます。**\n   - *Before going to school, I have something to eat.*\n\n### Commentary (解説)\n\n- 「まえに」は、V1で表される行動よりV2で表される行動の方が先に行われることを示す。\n  *(「まえに」 indicates that the action V2 occurs before the action V1.)*\n\n---\n\n<a id=\"lesson-15-2\"></a>", "checksum": "3ad1ed40e0b9fe0c", "layer": "CORE"}, {"occurrence_id": "grammar_L15_2", "section_code": "15.2", "lesson": 15, "subsection": 2, "title": "ねる 前に、おふろに 入ると いいですよ。", "source_file": "grammar.md", "source_line": 544, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/15_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/15_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "ねる 前に、おふろに 入ると いいですよ。", "english": "Before going to bed, it's good to take a bath."}], "use_japanese": "体調を崩している人などに、軽いアドバイスをするときに使う", "use_english": "Used when giving some light advice to people, especially someone who isn't feeling well.", "structure_tables_markdown": ["### Structure (構造図)\n| V-る | と | いいです（よ） |\n| --- | --- | --- |", "### ＜Vるけい／じしょけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| およぎます ききます のみます はいります はしります まわします | およぐ きく のむ はいる はしる まわす | おきます たべます ねます | おきる たべる ねる | します | する |"], "examples": [{"japanese": "①A：さいきん かたが いたいです。", "english": "A: Recently, my shoulder hurts."}, {"japanese": "B：かたを ゆっくり まわすと いいですよ。", "english": "B: It's good if you slowly rotate your shoulders."}, {"japanese": "②A：さいきん ストレスで あまり ねられません。", "english": "A: Recently, I can't sleep well because of stress."}, {"japanese": "B：ねる 前に、たいそうを すると いいですよ。", "english": "B: Before going to bed, it's good if you do some stretching exercises."}], "commentary": [{"japanese": "文末に「よ」をつけて、言い方をやわらかくすることが多い。", "english": "It is common to attach 「よ」 at the end of the sentence to tone down the harshness of a statement."}], "raw_markdown": "## Lesson 15.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/15_2/](https://www.marugoto-online.jp/a2/support/lesson/15_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/15_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/15_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** ねる 前に、おふろに 入ると いいですよ。\n  **English:** Before going to bed, it's good to take a bath.\n\n### Use (使い方)\n\n- 体調を崩している人などに、軽いアドバイスをするときに使う\n  *(Used when giving some light advice to people, especially someone who isn't feeling well.)*\n\n### Structure (構造図)\n\n| V-る | と | いいです（よ） |\n| --- | --- | --- |\n\n### ＜Vるけい／じしょけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| およぎます ききます のみます はいります はしります まわします | およぐ きく のむ はいる はしる まわす | おきます たべます ねます | おきる たべる ねる | します | する |\n\n### Examples (例文)\n\n1. **①A：さいきん かたが いたいです。**\n   - *A: Recently, my shoulder hurts.*\n2. **B：かたを ゆっくり まわすと いいですよ。**\n   - *B: It's good if you slowly rotate your shoulders.*\n3. **②A：さいきん ストレスで あまり ねられません。**\n   - *A: Recently, I can't sleep well because of stress.*\n4. **B：ねる 前に、たいそうを すると いいですよ。**\n   - *B: Before going to bed, it's good if you do some stretching exercises. *\n\n### Commentary (解説)\n\n- 文末に「よ」をつけて、言い方をやわらかくすることが多い。\n  *(It is common to attach 「よ」 at the end of the sentence to tone down the harshness of a statement.)*\n\n---\n\n<a id=\"lesson-15-3\"></a>", "checksum": "aa46add88ac1e439", "layer": "CORE"}, {"occurrence_id": "grammar_L15_3", "section_code": "15.3", "lesson": 15, "subsection": 3, "title": "きゅうに くびを まわさないで ください。", "source_file": "grammar.md", "source_line": 589, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/15_3/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/15_3/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "きゅうに くびを まわさないで ください。", "english": "Don't rotate your neck too suddenly."}], "use_japanese": "何かをしないように注意やアドバイスをするときに使う", "use_english": "Used when warning or advising someone not to do something.", "structure_tables_markdown": ["### Structure (構造図)\n| V-ないで | ください |\n| --- | --- |", "### ＜Vないけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| あるきます いきます まわします よみます | あるかない いかない まわさない よまない | ～すぎます みます | ～すぎない みない | します | しない |"], "examples": [{"japanese": "①げんきが ありませんね。むりを しないで ください。", "english": "You don't look too healthy. Don't try too hard."}, {"japanese": "②あまり お酒を 飲まないで ください。", "english": "Please don't drink too much alcohol."}], "commentary": [{"japanese": "「V-ないで」は、「飲まない ＋ で → 飲まないで」のように「Vない形」に「で」をつけた形。", "english": "「V-ないで」 can be made by adding 「で」 to 「Vないform」 as in 「飲まない ＋ で → 飲まないで」."}], "raw_markdown": "## Lesson 15.3\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/15_3/](https://www.marugoto-online.jp/a2/support/lesson/15_3/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/15_3/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/15_3/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** きゅうに くびを まわさないで ください。\n  **English:** Don't rotate your neck too suddenly.\n\n### Use (使い方)\n\n- 何かをしないように注意やアドバイスをするときに使う\n  *(Used when warning or advising someone not to do something.)*\n\n### Structure (構造図)\n\n| V-ないで | ください |\n| --- | --- |\n\n### ＜Vないけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| あるきます いきます まわします よみます | あるかない いかない まわさない よまない | ～すぎます みます | ～すぎない みない | します | しない |\n\n### Examples (例文)\n\n1. **①げんきが ありませんね。むりを しないで ください。**\n   - *You don't look too healthy. Don't try too hard.*\n2. **②あまり お酒を 飲まないで ください。**\n   - *Please don't drink too much alcohol.*\n\n### Commentary (解説)\n\n- 「V-ないで」は、「飲まない ＋ で → 飲まないで」のように「Vない形」に「で」をつけた形。\n  *(「V-ないで」 can be made by adding 「で」 to 「Vないform」 as in 「飲まない ＋ で → 飲まないで」.)*\n\n---\n\n<a id=\"lesson-16-1\"></a>", "checksum": "3379825750c897d7", "layer": "CORE"}, {"occurrence_id": "grammar_L16_1", "section_code": "16.1", "lesson": 16, "subsection": 1, "title": "けんこうの ために ヨガを したり、走ったり しています。", "source_file": "grammar.md", "source_line": 630, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/16_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/16_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "けんこうの ために ヨガを したり、走ったり しています。", "english": "For my health, I do yoga, go running, and more."}], "use_japanese": "いつもしていることについて、例をあげて言うときに使う", "use_english": "Used when giving examples of something you do regularly.", "structure_tables_markdown": ["### Structure (構造図)\n| V1 たり | V1 | たり | V2 たり | V2 | たり | して | います |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| V1 | たり |   |   |   |   |   |   |\n| V2 | たり |   |   |   |   |   |   |\n| V1 | たり |\n| --- | --- |\n| V2 | たり |\n| --- | --- |", "### ＜Vたけい＞\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| あそびます あるきます およぎます はしります | あそんだ あるいた およいだ はしった | みます たべます | みた たべた | します | した |"], "examples": [{"japanese": "①うんどうの ために、ヨガを したり、トレーニングを したり しています。", "english": "For working out, I do yoga, training, and more."}, {"japanese": "②A：けんこうの ために 何か していますか。", "english": "A: Do you do something for your health?"}, {"japanese": "B：はい。歩いたり、ジョギングを したり しています。", "english": "B: Yes. I go for walks, go jogging, and more."}, {"japanese": "A：そうですか。ジョギングは どれぐらい していますか。", "english": "A: Is that so. How often do you go jogging?"}, {"japanese": "B：週に ２回ぐらいです。", "english": "B: About twice a week."}], "commentary": [{"japanese": "「V-たり」の形は、「泳いだ ＋ り → 泳いだり」のように「Vた形」に「り」をつけて作る。", "english": "The form of 「V-たり」 can be made by adding 「り」 to 「V たform」 as in 「泳いだ ＋ り → 泳いだり」."}, {"japanese": "ほかにも該当する動作があることを暗示する。", "english": "This implies that there are another relevant actions."}], "raw_markdown": "## Lesson 16.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/16_1/](https://www.marugoto-online.jp/a2/support/lesson/16_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/16_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/16_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** けんこうの ために ヨガを したり、走ったり しています。\n  **English:** For my health, I do yoga, go running, and more.\n\n### Use (使い方)\n\n- いつもしていることについて、例をあげて言うときに使う\n  *(Used when giving examples of something you do regularly.)*\n\n### Structure (構造図)\n\n| V1 たり | V1 | たり | V2 たり | V2 | たり | して | います |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| V1 | たり |   |   |   |   |   |   |\n| V2 | たり |   |   |   |   |   |   |\n\n| V1 | たり |\n| --- | --- |\n\n| V2 | たり |\n| --- | --- |\n\n### ＜Vたけい＞\n\n| 1グループ | 2グループ | 3グループ |   |   |   |\n| --- | --- | --- | --- | --- | --- |\n| あそびます あるきます およぎます はしります | あそんだ あるいた およいだ はしった | みます たべます | みた たべた | します | した |\n\n### Examples (例文)\n\n1. **①うんどうの ために、ヨガを したり、トレーニングを したり しています。**\n   - *For working out, I do yoga, training, and more.*\n2. **②A：けんこうの ために 何か していますか。**\n   - *A: Do you do something for your health?*\n3. **B：はい。歩いたり、ジョギングを したり しています。**\n   - *B: Yes. I go for walks, go jogging, and more.*\n4. **A：そうですか。ジョギングは どれぐらい していますか。**\n   - *A: Is that so. How often do you go jogging?*\n5. **B：週に ２回ぐらいです。**\n   - *B: About twice a week.*\n\n### Commentary (解説)\n\n- 「V-たり」の形は、「泳いだ ＋ り → 泳いだり」のように「Vた形」に「り」をつけて作る。\n  *(The form of 「V-たり」 can be made by adding 「り」 to 「V たform」 as in 「泳いだ ＋ り → 泳いだり」.)*\n- ほかにも該当する動作があることを暗示する。\n  *(This implies that there are another relevant actions.)*\n\n---\n\n<a id=\"lesson-16-2\"></a>", "checksum": "0b08f56696658985", "layer": "CORE"}, {"occurrence_id": "grammar_L16_2", "section_code": "16.2", "lesson": 16, "subsection": 2, "title": "朝ごはんを 食べる 人は ２０人です。", "source_file": "grammar.md", "source_line": 687, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/16_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/16_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "朝ごはんを 食べる 人は ２０人です。", "english": "There are 20 people who eat breakfast."}, {"japanese": "朝ごはんを 食べない 人は ３０人です。", "english": "There are 30 people who don't eat breakfast."}], "use_japanese": "どんな人か説明を加えて言うときに使う", "use_english": "Used when explaining in detail about the type of person.", "structure_tables_markdown": ["### Structure (構造図)\n| V（） (Plain form) | N |\n| --- | --- |\n| ひかこ (Non-past) | かこ (Past) |   |   |\n| --- | --- | --- | --- |\n| ていねいけい (Polite form) | ふつうけい (Plain form) | ていねいけい (Polite form) | ふつうけい (Plain form) |\n| たべます | たべる | たべました | たべた |\n| たべません | たべない | たべませんでした | たべなかった |"], "examples": [{"japanese": "①よく お酒を 飲む 人は １０人です。飲まない 人は ５人です。", "english": "There are 10 people who often drink alcohol. There are 5 people who don't drink."}, {"japanese": "②毎日 スポーツを する 人は １０人です。ときどき スポーツを する 人は ２０人です。", "english": "There are 10 people who play sports every day. There are 20 people who play sports sometimes."}, {"japanese": "ぜんぜん しない 人は ２５人です。", "english": "There are 25 people who don’t do any sports."}, {"japanese": "③はじめて トレーニングする 人は、トレーナーに 聞いて ください。", "english": "For people training for the first time, please speak to a trainer."}], "commentary": [{"japanese": "Vは、Nを修飾する。", "english": "V modifies N."}], "raw_markdown": "## Lesson 16.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/16_2/](https://www.marugoto-online.jp/a2/support/lesson/16_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/16_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/16_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** 朝ごはんを 食べる 人は ２０人です。\n  **English:** There are 20 people who eat breakfast.\n- **Japanese:** 朝ごはんを 食べない 人は ３０人です。\n  **English:** There are 30 people who don't eat breakfast.\n\n### Use (使い方)\n\n- どんな人か説明を加えて言うときに使う\n  *(Used when explaining in detail about the type of person.)*\n\n### Structure (構造図)\n\n| V（） (Plain form) | N |\n| --- | --- |\n\n| ひかこ (Non-past) | かこ (Past) |   |   |\n| --- | --- | --- | --- |\n| ていねいけい (Polite form) | ふつうけい (Plain form) | ていねいけい (Polite form) | ふつうけい (Plain form) |\n| たべます | たべる | たべました | たべた |\n| たべません | たべない | たべませんでした | たべなかった |\n\n### Examples (例文)\n\n1. **①よく お酒を 飲む 人は １０人です。飲まない 人は ５人です。**\n   - *There are 10 people who often drink alcohol. There are 5 people who don't drink.*\n2. **②毎日 スポーツを する 人は １０人です。ときどき スポーツを する 人は ２０人です。**\n   - *There are 10 people who play sports every day. There are 20 people who play sports sometimes.*\n3. **ぜんぜん しない 人は ２５人です。**\n   - *There are 25 people who don’t do any sports.*\n4. **③はじめて トレーニングする 人は、トレーナーに 聞いて ください。**\n   - *For people training for the first time, please speak to a trainer.*\n\n### Commentary (解説)\n\n- Vは、Nを修飾する。\n  *(V modifies N.)*\n\n---\n\n<a id=\"lesson-17-1\"></a>", "checksum": "7c56ed1f7d53a5cd", "layer": "CORE"}, {"occurrence_id": "grammar_L17_1", "section_code": "17.1", "lesson": 17, "subsection": 1, "title": "この かばんは あねに もらったんです。", "source_file": "grammar.md", "source_line": 734, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/17_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/17_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "この かばんは あねに もらったんです。", "english": "I received this bag from my older sister."}], "use_japanese": "事情や理由などをさらに詳しく説明するときに使う", "use_english": "Used when explaining in detail the situation or reason of something.", "structure_tables_markdown": ["### Structure (構造図)\n| S（） (Plain form) | ん | です |\n| --- | --- | --- |\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ → ナA-な | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ → N-な | N-じゃない | N-だった | N-じゃなかった |"], "examples": [{"japanese": "①A：その 時計、すてきですね。", "english": "A: That watch is very nice."}, {"japanese": "B：ありがとうございます。母に もらったんです。", "english": "B: Thank you very much. My mother gave it to me."}, {"japanese": "②A：どうしたんですか。", "english": "A: What's wrong?"}, {"japanese": "B：少し 頭が いたいんです。", "english": "B: My head hurts a little."}, {"japanese": "③A：かわいい シャツですね。", "english": "A: That's a cute shirt."}, {"japanese": "B：これ、あねに もらいました。誕生日の プレゼントなんです。", "english": "B: I got this from my older sister. It was a birthday present."}], "commentary": [], "raw_markdown": "## Lesson 17.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/17_1/](https://www.marugoto-online.jp/a2/support/lesson/17_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/17_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/17_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** この かばんは あねに もらったんです。\n  **English:** I received this bag from my older sister.\n\n### Use (使い方)\n\n- 事情や理由などをさらに詳しく説明するときに使う\n  *(Used when explaining in detail the situation or reason of something.)*\n\n### Structure (構造図)\n\n| S（） (Plain form) | ん | です |\n| --- | --- | --- |\n\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ → ナA-な | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ → N-な | N-じゃない | N-だった | N-じゃなかった |\n\n### Examples (例文)\n\n1. **①A：その 時計、すてきですね。**\n   - *A: That watch is very nice.*\n2. **B：ありがとうございます。母に もらったんです。**\n   - *B: Thank you very much. My mother gave it to me.*\n3. **②A：どうしたんですか。**\n   - *A: What's wrong?*\n4. **B：少し 頭が いたいんです。**\n   - *B: My head hurts a little.*\n5. **③A：かわいい シャツですね。**\n   - *A: That's a cute shirt.*\n6. **B：これ、あねに もらいました。誕生日の プレゼントなんです。**\n   - *B: I got this from my older sister. It was a birthday present.*\n\n---\n\n<a id=\"lesson-17-2\"></a>", "checksum": "bd29ba7b7a0b7ae7", "layer": "CORE"}, {"occurrence_id": "grammar_L17_2", "section_code": "17.2", "lesson": 17, "subsection": 2, "title": "ジョイさんは さとうさんに 花を あげます。", "source_file": "grammar.md", "source_line": 781, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/17_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/17_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "ジョイさんは さとうさんに 花を あげます。", "english": "Joy will give flowers to Ms. Sato."}], "use_japanese": "プレゼントする相手やものを言うときに使う", "use_english": "Used when talking about who you will give a present to or what you will give.", "structure_tables_markdown": ["### Structure (構造図)\n| N1（） (Person) | は／が | N2（） (Person) | に | N3（） (Things) | を | あげます |\n| --- | --- | --- | --- | --- | --- | --- |"], "examples": [{"japanese": "①マリーナさんは 秋川さんに チョコレートを あげました。", "english": "Marina gave Ms. Akikawa chocolate."}, {"japanese": "②きょねんの 母の 日に 母に 花を あげました。", "english": "I gave flowers for Mother's Day last year."}], "commentary": [{"japanese": "N1がN2にN3（物）を与えることを表す。", "english": "This sentence pattern indicates that N1 gives N3 (things) to N2."}, {"japanese": "N2は話し手（私）にならない。例）× マリーナさんは私にチョコレートをあげました。", "english": "N2 can never be the speaker (I)."}], "raw_markdown": "## Lesson 17.2\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/17_2/](https://www.marugoto-online.jp/a2/support/lesson/17_2/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/17_2/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/17_2/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** ジョイさんは さとうさんに 花を あげます。\n  **English:** Joy will give flowers to Ms. Sato.\n\n### Use (使い方)\n\n- プレゼントする相手やものを言うときに使う\n  *(Used when talking about who you will give a present to or what you will give.)*\n\n### Structure (構造図)\n\n| N1（） (Person) | は／が | N2（） (Person) | に | N3（） (Things) | を | あげます |\n| --- | --- | --- | --- | --- | --- | --- |\n\n### Examples (例文)\n\n1. **①マリーナさんは 秋川さんに チョコレートを あげました。**\n   - *Marina gave Ms. Akikawa chocolate.*\n2. **②きょねんの 母の 日に 母に 花を あげました。**\n   - *I gave flowers for Mother's Day last year.*\n\n### Commentary (解説)\n\n- N1がN2にN3（物）を与えることを表す。\n  *(This sentence pattern indicates that N1 gives N3 (things) to N2.)*\n- N2は話し手（私）にならない。例）× マリーナさんは私にチョコレートをあげました。\n  *(N2 can never be the speaker (I).)*\n\n---\n\n<a id=\"lesson-17-3\"></a>", "checksum": "63e7e3d13a96728d", "layer": "CORE"}, {"occurrence_id": "grammar_L17_3", "section_code": "17.3", "lesson": 17, "subsection": 3, "title": "さとうさんは ジョイさんに／から 花を もらいます。", "source_file": "grammar.md", "source_line": 818, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/17_3/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/17_3/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "さとうさんは ジョイさんに／から 花を もらいます。", "english": "Ms. Sato will receive flowers from Joy."}], "use_japanese": "プレゼントされた相手やものを言うときに使う", "use_english": "Used when talking about someone that has received something or what they received.", "structure_tables_markdown": ["### Structure (構造図)\n| N1（） (Person) | は／が | N2（） (Person) | に | N3（） (Things) | を | もらいます |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n> *Only studied in Rikai*"], "examples": [{"japanese": "①秋川さんは マリーナさんに チョコレートを もらいました。", "english": "Ms. Akikawa received chocolates from Marina."}, {"japanese": "②山中さんは お子さんから ペンを もらいました。", "english": "Mr. Yamanaka received a pen from his child."}], "commentary": [{"japanese": "N1がN2からN3（物）を受けることを表す。", "english": "This sentence pattern indicates that N1 received N3 (things) from N2."}, {"japanese": "N2は話し手（私）にならない。例）× マリーナさんは私にチョコレートをもらいました。", "english": "N2 can never be the speaker (I)."}], "raw_markdown": "## Lesson 17.3\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/17_3/](https://www.marugoto-online.jp/a2/support/lesson/17_3/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/17_3/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/17_3/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** さとうさんは ジョイさんに／から 花を もらいます。\n  **English:** Ms. Sato will receive flowers from Joy.\n\n### Use (使い方)\n\n- プレゼントされた相手やものを言うときに使う\n  *(Used when talking about someone that has received something or what they received.)*\n\n### Structure (構造図)\n\n| N1（） (Person) | は／が | N2（） (Person) | に | N3（） (Things) | を | もらいます |   |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n> *Only studied in Rikai*\n\n### Examples (例文)\n\n1. **①秋川さんは マリーナさんに チョコレートを もらいました。**\n   - *Ms. Akikawa received chocolates from Marina.*\n2. **②山中さんは お子さんから ペンを もらいました。**\n   - *Mr. Yamanaka received a pen from his child.*\n\n### Commentary (解説)\n\n- N1がN2からN3（物）を受けることを表す。\n  *(This sentence pattern indicates that N1 received N3 (things) from N2.)*\n- N2は話し手（私）にならない。例）× マリーナさんは私にチョコレートをもらいました。\n  *(N2 can never be the speaker (I).)*\n\n---\n\n<a id=\"lesson-17-4\"></a>", "checksum": "8ddbb8b389734d11", "layer": "CORE"}, {"occurrence_id": "grammar_L17_4", "section_code": "17.4", "lesson": 17, "subsection": 4, "title": "赤ちゃんが 着る もの", "source_file": "grammar.md", "source_line": 857, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/17_4/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/17_4/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "赤ちゃんが 着る もの", "english": "Something a baby wears"}], "use_japanese": "どんなものか説明を加えて言うときに使う", "use_english": "Used when explaining about something in detail.", "structure_tables_markdown": ["### Structure (構造図)\n| V（） (Plain form) | N |\n| --- | --- |\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ → ナA-な | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ → N-な | N-じゃない | N-だった | N-じゃなかった |"], "examples": [{"japanese": "①けっこんの お祝いに 料理の とき 使う ものを あげます。", "english": "When I give a wedding gift, I give something that can be used for cooking."}, {"japanese": "②A：しゅっさんの お祝いに どんな ものを もらいましたか。", "english": "A: What did you receive as a gift when you had a baby?"}, {"japanese": "B：赤ちゃんが あそぶ ものを もらいました。", "english": "B: I received something the baby can play with."}], "commentary": [{"japanese": "Vは、Nを修飾する。", "english": "V modifies N."}], "raw_markdown": "## Lesson 17.4\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/17_4/](https://www.marugoto-online.jp/a2/support/lesson/17_4/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/17_4/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/17_4/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** 赤ちゃんが 着る もの\n  **English:** Something a baby wears\n\n### Use (使い方)\n\n- どんなものか説明を加えて言うときに使う\n  *(Used when explaining about something in detail.)*\n\n### Structure (構造図)\n\n| V（） (Plain form) | N |\n| --- | --- |\n\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ → ナA-な | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ → N-な | N-じゃない | N-だった | N-じゃなかった |\n\n### Examples (例文)\n\n1. **①けっこんの お祝いに 料理の とき 使う ものを あげます。**\n   - *When I give a wedding gift, I give something that can be used for cooking.*\n2. **②A：しゅっさんの お祝いに どんな ものを もらいましたか。**\n   - *A: What did you receive as a gift when you had a baby?*\n3. **B：赤ちゃんが あそぶ ものを もらいました。**\n   - *B: I received something the baby can play with.*\n\n### Commentary (解説)\n\n- Vは、Nを修飾する。\n  *(V modifies N.)*\n\n---\n\n<a id=\"lesson-18-1\"></a>", "checksum": "cf74830dbeab8200", "layer": "CORE"}, {"occurrence_id": "grammar_L18_1", "section_code": "18.1", "lesson": 18, "subsection": 1, "title": "お祝いは パーティーが いいと 思います。", "source_file": "grammar.md", "source_line": 903, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/18_1/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/18_1/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "お祝いは パーティーが いいと 思います。", "english": "For a celebration, I think a party is good."}], "use_japanese": "自分の意見や予想を言うときに使う", "use_english": "Used when talking about your own opinion or guess.", "structure_tables_markdown": ["### Structure (構造図)\n| S（） (Plain form) | と | 思います |\n| --- | --- | --- |\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ | N-じゃない | N-だった | N-じゃなかった |"], "examples": [{"japanese": "①秋川さんは 花が 好きだと 思います。", "english": "I think Ms. Akikawa likes flowers."}, {"japanese": "②プレゼントは ワインが いいと 思います。", "english": "I think wine is a good present."}, {"japanese": "③たなかさんは きっと きにいると 思います。", "english": "I think Mr. Tanaka will like it for sure."}, {"japanese": "④たかはしさんは スポーツが とくいじゃないと 思います。", "english": "I don’t think Ms. Takahashi is good at sports."}, {"japanese": "⑤A：プレゼントは 何が いいと 思いますか。", "english": "A: What do you think is good for a present?"}, {"japanese": "B：花がいいと思います。", "english": "B: I think flowers are good."}], "commentary": [{"japanese": "「Sと思いますか」で、聞き手の意見を聞く。（⑤）", "english": "You can ask the listener's opinion by using 「Sと思いますか」.（⑤）"}], "raw_markdown": "## Lesson 18.1\n\n- **Source URL:** [https://www.marugoto-online.jp/a2/support/lesson/18_1/](https://www.marugoto-online.jp/a2/support/lesson/18_1/)\n- **PDF Link:** [https://www.marugoto-online.jp/a2/support/lesson/18_1/pdf/file_eng.pdf](https://www.marugoto-online.jp/a2/support/lesson/18_1/pdf/file_eng.pdf)\n\n### Basic Sentence (基本文)\n\n- **Japanese:** お祝いは パーティーが いいと 思います。\n  **English:** For a celebration, I think a party is good.\n\n### Use (使い方)\n\n- 自分の意見や予想を言うときに使う\n  *(Used when talking about your own opinion or guess.)*\n\n### Structure (構造図)\n\n| S（） (Plain form) | と | 思います |\n| --- | --- | --- |\n\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナA-だ | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ | N-じゃない | N-だった | N-じゃなかった |\n\n### Examples (例文)\n\n1. **①秋川さんは 花が 好きだと 思います。**\n   - *I think Ms. Akikawa likes flowers.*\n2. **②プレゼントは ワインが いいと 思います。**\n   - *I think wine is a good present.*\n3. **③たなかさんは きっと きにいると 思います。**\n   - *I think Mr. Tanaka will like it for sure.*\n4. **④たかはしさんは スポーツが とくいじゃないと 思います。**\n   - *I don’t think Ms. Takahashi is good at sports.*\n5. **⑤A：プレゼントは 何が いいと 思いますか。**\n   - *A: What do you think is good for a present?*\n6. **B：花がいいと思います。**\n   - *B: I think flowers are good.*\n\n### Commentary (解説)\n\n- 「Sと思いますか」で、聞き手の意見を聞く。（⑤）\n  *(You can ask the listener's opinion by using 「Sと思いますか」.（⑤）)*\n\n---\n\n<a id=\"lesson-18-2\"></a>", "checksum": "504598ea7ce56bab", "layer": "CORE"}, {"occurrence_id": "grammar_L18_2", "section_code": "18.2", "lesson": 18, "subsection": 2, "title": "たなかさんは 楽しかったと 言っていました。", "source_file": "grammar.md", "source_line": 955, "source_url": "https://www.marugoto-online.jp/a2/support/lesson/18_2/", "pdf_link": "https://www.marugoto-online.jp/a2/support/lesson/18_2/pdf/file_eng.pdf", "basic_sentences": [{"japanese": "たなかさんは 楽しかったと 言っていました。", "english": "Mr. Tanaka said he had a good time."}], "use_japanese": "ほかの人が話したことを伝えるときに使う", "use_english": "Used when conveying something someone else said.", "structure_tables_markdown": ["### Structure (構造図)\n| S（） (Plain form) | と | 言っていました |\n| --- | --- | --- |\n|   | ふつうけい (Plain form) |   |   |   |\n| --- | --- | --- | --- | --- |\n|   | ひかこ (Non-past) | かこ (Past) |   |   |\n|   | こうてい (affirmative) | ひてい (negative) | こうてい (affirmative) | ひてい (negative) |\n| V | V-る | V-ない | V-た | V-なかった |\n| イA | イA-い | イA-くない | イA-かった | イA-くなかった |\n| ナA | ナ-Aだ | ナA-じゃない | ナA-だった | ナA-じゃなかった |\n| N | N-だ | N-じゃない | N-だった | N-じゃなかった |"], "examples": [{"japanese": "①秋川さんは お酒が 好きだと 言っていました。", "english": "Ms. Akikawa said she likes alcohol."}, {"japanese": "②プレゼントは とても きにいったと 言っていました。", "english": "They said that they really like the present."}, {"japanese": "③たかはしさんは あまり うんどうしないと 言っていました。", "english": "Ms. Takahashi said she doesn't often exercise."}], "commentary": [], "raw_markdown": "## Lesson 18.2\n\n- **S _span": "歩いたり", "source_ref": "grammar.md#lesson-16-1 (Example 2B)"}, {"id": "listen_L17", "lesson": 17, "japanese": "山中さんは お子さんから ペンを もらいました。", "kana": "やまなかさんは おこさんから ペンを もらいました。", "vietnamese": "Anh Yamanaka đã nhận một cây bút từ con của mình.", "focus_kanji": "子", "focus_word": "お子さんから", "hidden_span": "もらいました", "source_ref": "grammar.md#lesson-17-3 (Example 2)"}, {"id": "listen_L18", "lesson": 18, "japanese": "秋川さんは お酒が 好きだと 言っていました。", "kana": "あきかわさんは おさけが すきだと いっていました。", "vietnamese": "Cô Akikawa có nói rằng cô ấy thích rượu.", "focus_kanji": "酒", "focus_word": "言っていました", "hidden_span": "好きだと 言っていました", "source_ref": "grammar.md#lesson-18-2 (Example 1)"}], "dokkai_passages": [{"id": "dokkai_L11_12", "lessons": [11, 12], "title_jp": "らいしゅうの ピクニックと お弁当", "title_vi": "Buổi dã ngoại tuần sau và hộp cơm Bento", "layer": "CONTEXTUAL_EXTENSION", "japanese": "らいしゅうの 日よう日に みんなで ピクニックに 行きます。私は たまごやきと おにぎりを 作っていきます。おにぎりの 中に しゃけと うめぼしが 入ります。うめぼしは すっぱいですが、とても おいしいです。飲み物は お茶と ジュースを 持っていきます。", "kana": "らいしゅうの にちようびに みんなで ピクニックに いきます。わたしは たまごやきと おにぎりを つくっていきます。おにぎりの なかに しゃけと うめぼしが はいります。うめぼしは すっぱいですが、とても おいしいです。のみものは おちゃと ジュースを もっていきます。", "vietnamese": "Chủ Nhật tuần sau mọi người sẽ cùng đi dã ngoại. Tôi sẽ làm trứng cuộn và cơm nắm mang đi. Bên trong cơm nắm có cá hồi và mơ muối. Mơ muối tuy chua nhưng rất ngon. Về đồ uống, tôi sẽ mang theo trà và nước ép.", "question_vi": "Người viết sẽ tự làm món gì mang đi dã ngoại?", "options_vi": [{"id": "a", "text": "Trứng cuộn (たまごやき) và cơm nắm (おにぎり)", "correct": true}, {"id": "b", "text": "Bánh mì sandwich và gà rán karaage", "correct": false}, {"id": "c", "text": "Rượu sake Nhật Bản và phô mai", "correct": false}]}, {"id": "dokkai_L13_14", "lessons": [13, 14], "title_jp": "日本の 支社での 仕事", "title_vi": "Công việc tại chi nhánh Nhật Bản", "layer": "CONTEXTUAL_EXTENSION", "japanese": "私は 日本に 来て ３か月に なります。今、東京の 支社で 事務の 仕事を しています。オフィスは 新しいですが、朝から 夜まで ちょっと さむすぎます。スタッフの みなさんは とても やさしいです。わからない とき、いつでも 質問しても いいです。", "kana": "わたしは にほんに きて さん
